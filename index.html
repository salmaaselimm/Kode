<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KODE — QR Invitation & Access System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<style>
:root{
  --bg:#080808;--panel:#101010;--panel2:#151515;--panel3:#1b1b1b;
  --line:#222;--line2:#2e2e2e;--text:#f3f3f3;--soft:#c9c9c9;--muted:#8a8a8a;--dim:#5c5c5c;
  --metal:linear-gradient(135deg,#ffffff 0%,#cfcfcf 28%,#8e8e8e 52%,#d9d9d9 74%,#f4f4f4 100%);
  --metal-soft:linear-gradient(180deg,#e9e9e9,#a9a9a9);
  --ok:#72dd9f;--warn:#e8bf5f;--bad:#f07474;--info:#aab9ff;
  --r:16px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
body{background:
  radial-gradient(1200px 600px at 85% -10%,rgba(255,255,255,.06),transparent 60%),
  radial-gradient(800px 500px at -10% 110%,rgba(255,255,255,.035),transparent 60%),var(--bg);min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.app{display:grid;grid-template-columns:252px 1fr;min-height:100vh}

/* Sidebar */
.side{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:rgba(5,5,5,.85);backdrop-filter:blur(8px);padding:22px 14px;display:flex;flex-direction:column;gap:26px;z-index:30}
.brand{display:flex;align-items:center;gap:12px;padding:0 6px}
.brand svg{width:46px;height:46px;color:#fff;flex:none}
.brand b{font-family:Montserrat,Inter,system-ui,sans-serif;font-weight:900;letter-spacing:.32em;font-size:16px;display:block}
.brand small{display:block;color:var(--muted);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:11px;color:#a9a9a9;text-decoration:none;font-weight:500;transition:.15s}
.nav a:hover{background:#121212;color:#fff}
.nav a.on{background:#171717;color:#fff;box-shadow:inset 0 0 0 1px #262626}
.nav a.on .ico{color:#fff}
.nav .ico{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav .badge{margin-left:auto;font-size:11px;background:#1f1f1f;border:1px solid #2a2a2a;padding:0 8px;border-radius:99px;color:#d6d6d6;font-weight:600}
.side-event{margin-top:auto;border:1px solid var(--line);border-radius:14px;padding:14px;background:linear-gradient(180deg,#121212,#0b0b0b)}
.side-event .lbl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.side-event .nm{font-family:Montserrat,Inter,system-ui,sans-serif;font-weight:700;margin:4px 0 2px;font-size:14px}
.side-event .dt{color:var(--soft);font-size:12.5px}
.side-event .cd{margin-top:10px;font-size:12px;color:var(--muted)}
.side-event .cd b{color:#fff}

/* Main */
main{padding:28px 36px 60px;min-width:0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:24px;flex-wrap:wrap}
.top h1{font-family:Montserrat,Inter,system-ui,sans-serif;font-weight:800;font-size:28px;margin:0;letter-spacing:-.01em}
.top p{margin:4px 0 0;color:var(--muted)}
.top .acts{display:flex;gap:10px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line2);background:#131313;color:#eee;padding:9px 15px;border-radius:11px;cursor:pointer;font-weight:600;font-size:13.5px;transition:.15s;white-space:nowrap}
.btn{text-decoration:none}
.btn:hover{border-color:#4a4a4a;background:#191919}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--metal);color:#0a0a0a;border-color:transparent;box-shadow:0 6px 22px rgba(255,255,255,.08),inset 0 1px 0 rgba(255,255,255,.6)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--soft)}
.btn.ghost:hover{background:#151515}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:9px}
.btn.danger:hover{border-color:#5a2a2a;color:#ffb3b3}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

.card{background:linear-gradient(180deg,rgba(22,22,22,.92),rgba(14,14,14,.92));border:1px solid var(--line);border-radius:var(--r);padding:20px}
.card h3{font-family:Montserrat,Inter,system-ui,sans-serif;font-size:14px;font-weight:700;margin:0 0 14px;letter-spacing:.02em;display:flex;align-items:center;gap:10px}
.card h3 .sub{font-family:Inter;font-weight:500;color:var(--muted);font-size:12.5px;margin-left:auto}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
.eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* KPIs */
.kpi{padding:16px 18px;position:relative;overflow:hidden}
.kpi .l{font-size:12px;color:var(--muted);font-weight:500}
.kpi .v{font-family:Montserrat,Inter,system-ui,sans-serif;font-weight:800;font-size:30px;line-height:1.15;margin-top:6px;letter-spacing:-.02em}
.kpi .s{font-size:12px;color:var(--dim);margin-top:2px}
.kpi .bar{position:absolute;left:0;bottom:0;height:2px;background:var(--metal)}

/* Hero */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:30px;align-items:center;padding:38px;position:relative;overflow:hidden}
.hero h2{font-family:Montserrat,Inter,system-ui,sans-serif;font-weight:800;font-size:34px;line-height:1.12;margin:12px 0 14px;letter-spacing:-.02em}
.hero h2 em{font-style:normal;background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--soft);max-width:560px;margin:0 0 24px;font-size:15px}
.hero-art{display:flex;justify-content:center;align-items:center;position:relative;min-height:240px}
.hero-art .logo-big{width:210px;height:210px;color:#fff;filter:drop-shadow(0 20px 50px rgba(255,255,255,.08))}
.hero-art .mini-qr{position:absolute;right:8%;bottom:4%;width:96px;height:96px;padding:8px;background:#fff;border-radius:12px;transform:rotate(8deg);box-shadow:0 18px 40px rgba(0,0,0,.6)}
.hero-art .mini-qr svg{width:100%;height:100%;display:block}
.steps .card{padding:18px}
.steps .n{font-family:Montserrat,Inter,system-ui,sans-serif;font-weight:900;font-size:28px;background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent}
.steps b{display:block;margin:6px 0 4px;font-family:Montserrat}
.steps p{margin:0;color:var(--muted);font-size:13px}

/* Funnel / bars */
.bars{display:flex;flex-direction:column;gap:12px}
.bar-row{display:grid;grid-template-columns:120px 1fr 74px;gap:12px;align-items:center;font-size:13px}
.bar-row .t{color:var(--soft)}
.bar-row .track{height:10px;background:#1c1c1c;border-radius:99px;overflow:hidden}
.bar-row .fill{height:100%;background:var(--metal);border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar-row .n{text-align:right;font-variant-numeric:tabular-nums;color:#fff;font-weight:600}
.bar-row .n span{color:var(--dim);font-weight:500;margin-left:4px}

.ring-wrap{display:flex;align-items:center;gap:22px}
.ring{width:132px;height:132px;flex:none}
.ring .big{font-family:Montserrat,Inter,system-ui,sans-serif;font-weight:800;font-size:22px;fill:#fff}
.ring .sm{font-size:10px;fill:#8a8a8a;letter-spacing:.1em}
.legend div{display:flex;justify-content:space-between;gap:18px;padding:5px 0;border-bottom:1px dashed #222;font-size:13px}
.legend div:last-child{border:0}
.legend b{font-variant-numeric:tabular-nums}

/* Feed */
.feed{display:flex;flex-direction:column;max-height:380px;overflow:auto}
.feed .it{display:flex;gap:12px;padding:10px 2px;border-bottom:1px solid #1b1b1b;font-size:13px}
.feed .it:last-child{border:0}
.feed .dot{width:28px;height:28px;border-radius:9px;background:#1a1a1a;border:1px solid #282828;display:grid;place-items:center;flex:none}
.feed .dot svg{width:14px;height:14px;stroke:#d9d9d9;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.feed .tm{color:var(--dim);font-size:12px;margin-left:auto;white-space:nowrap}
.empty{padding:34px 10px;text-align:center;color:var(--muted)}

/* Next step tiles */
.next{display:flex;flex-direction:column;gap:10px}
.next .tile{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid #232323;border-radius:12px;background:#121212}
.next .tile .tx{flex:1;font-size:13px}
.next .tile .tx b{display:block;font-size:13.5px}

/* Table */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.input,select.input,textarea.input{background:#0d0d0d;border:1px solid var(--line2);border-radius:10px;padding:9px 12px;outline:none;transition:.15s;width:100%}
.input:focus{border-color:#6a6a6a;box-shadow:0 0 0 3px rgba(255,255,255,.06)}
.search{position:relative;flex:1;min-width:200px;max-width:360px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:#777;fill:none;stroke-width:2}
.search .input{padding-left:34px}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;padding:12px 14px;background:#0e0e0e;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
td{padding:11px 14px;border-bottom:1px solid #191919;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#121212}
.gname b{display:block;font-weight:600}
.gname small{color:var(--muted)}
.code{font-family:'JetBrains Mono',monospace;font-size:12px;color:#ddd;background:#171717;border:1px solid #262626;padding:2px 7px;border-radius:6px;white-space:nowrap}
.warn-txt{color:var(--warn);font-size:11.5px;display:block}
.acts-cell{display:flex;gap:4px;justify-content:flex-end}
.iconbtn{width:30px;height:30px;border-radius:8px;border:1px solid transparent;background:transparent;display:grid;place-items:center;cursor:pointer;color:#bbb}
.iconbtn:hover{background:#1b1b1b;border-color:#2c2c2c;color:#fff}
.iconbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:600;border:1px solid;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-pending{color:#9a9a9a;border-color:#2e2e2e;background:#141414}
.st-invited{color:#e6e6e6;border-color:#3a3a3a;background:#1a1a1a}
.st-bounced{color:var(--bad);border-color:#4a2424;background:#1d1212}
.st-opened{color:var(--info);border-color:#2f3556;background:#13151f}
.st-confirmed{color:var(--ok);border-color:#24442f;background:#111b15}
.st-declined{color:var(--warn);border-color:#4a3d1f;background:#1c1810}
.st-checked{color:#0a0a0a;border-color:transparent;background:var(--metal)}
.st-checked::before{background:#0a0a0a}

.drop{border:1.5px dashed #333;border-radius:16px;padding:30px;text-align:center;background:rgba(255,255,255,.015);transition:.15s;cursor:pointer}
.drop:hover,.drop.over{border-color:#8a8a8a;background:rgba(255,255,255,.04)}
.drop .ic{width:46px;height:46px;margin:0 auto 10px;border-radius:13px;display:grid;place-items:center;background:#161616;border:1px solid #2a2a2a}
.drop .ic svg{width:22px;height:22px;stroke:#eee;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.drop b{font-family:Montserrat,Inter,system-ui,sans-serif;font-size:15px}
.drop p{margin:6px 0 0;color:var(--muted);font-size:13px}

/* Forms */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.02em}
textarea.input{min-height:120px;resize:vertical;line-height:1.55}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{font-family:'JetBrains Mono',monospace;font-size:11.5px;padding:3px 8px;border-radius:7px;background:#161616;border:1px solid #2a2a2a;cursor:pointer;color:#cfcfcf}
.chip:hover{border-color:#555;color:#fff}
.tabs{display:flex;gap:4px;background:#0d0d0d;border:1px solid var(--line);padding:4px;border-radius:12px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:7px 12px;border-radius:9px;cursor:pointer;color:#9a9a9a;font-weight:600;font-size:12.5px}
.tabs button.on{background:#1e1e1e;color:#fff}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid #1b1b1b}
.toggle:last-child{border:0}
.toggle small{display:block;color:var(--muted);font-size:12px}
.sw{position:relative;width:40px;height:23px;flex:none}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:#262626;border-radius:99px;cursor:pointer;transition:.2s}
.sw span::after{content:"";position:absolute;left:3px;top:3px;width:17px;height:17px;border-radius:50%;background:#777;transition:.2s}
.sw input:checked+span{background:#d8d8d8}
.sw input:checked+span::after{left:20px;background:#0a0a0a}

.progress{height:8px;background:#1b1b1b;border-radius:99px;overflow:hidden;margin:12px 0 6px}
.progress div{height:100%;background:var(--metal);width:0;transition:width .15s}
.note{font-size:12px;color:var(--dim);display:flex;gap:8px;align-items:flex-start;margin-top:12px;line-height:1.45}
.note svg{width:14px;height:14px;flex:none;margin-top:2px;stroke:#777;fill:none;stroke-width:2}

/* Email preview */
.mail{background:#f6f6f6;color:#111;border-radius:16px;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.5)}
.mail-meta{background:#e9e9e9;padding:12px 18px;font-size:12px;color:#555;border-bottom:1px solid #ddd}
.mail-meta b{color:#111}
.mail-top{background:#0a0a0a;padding:26px 24px;display:flex;align-items:center;gap:14px;color:#fff}
.mail-top svg{width:46px;height:46px;color:#fff}
.mail-top .ev{font-family:Montserrat,Inter,system-ui,sans-serif;font-weight:800;font-size:17px}
.mail-top .ev small{display:block;font-family:Inter;font-weight:500;color:#aaa;font-size:12px}
.mail-body{padding:22px 24px 26px;white-space:pre-wrap;font-size:14px;line-height:1.6}
.ticket{margin:18px 0 6px;border:1px solid #ddd;border-radius:14px;background:#fff;display:flex;gap:18px;align-items:center;padding:16px;white-space:normal}
.ticket .q{width:150px;height:150px;flex:none}
.ticket .q svg{width:100%;height:100%;display:block}
.ticket .tn{font-family:Montserrat,Inter,system-ui,sans-serif;font-weight:800;font-size:17px}
.ticket .tm{font-size:12.5px;color:#555;margin-top:4px;line-height:1.5}
.ticket .tc{font-family:'JetBrains Mono',monospace;font-size:13px;margin-top:10px;background:#111;color:#fff;display:inline-block;padding:4px 9px;border-radius:7px;letter-spacing:.04em}
.rsvp{display:flex;gap:10px;margin-top:16px;white-space:normal}
.rsvp button{flex:1;padding:12px;border-radius:11px;font-weight:700;cursor:pointer;border:1px solid #111;font-size:14px}
.rsvp .yes{background:#0a0a0a;color:#fff}
.rsvp .no{background:#fff;color:#111}
.rsvp-done{margin-top:16px;padding:12px 14px;border-radius:11px;background:#eaf7ef;color:#16613a;font-weight:600;white-space:normal;display:flex;justify-content:space-between;align-items:center;gap:10px}
.rsvp-done.dec{background:#fbf3e3;color:#7a5a12}
.rsvp-done button{background:none;border:0;text-decoration:underline;cursor:pointer;color:inherit;font-size:12.5px}
.mail-foot{padding:14px 24px;font-size:11.5px;color:#888;border-top:1px solid #e3e3e3}

/* Scanner */
.scanner{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px}
.viewfinder{position:relative;aspect-ratio:4/3;border-radius:18px;background:#050505;border:1px solid #222;overflow:hidden;display:grid;place-items:center;cursor:pointer}
.viewfinder .frame{position:absolute;inset:16% 26%;}
.viewfinder .frame i{position:absolute;width:34px;height:34px;border-color:#e5e5e5;border-style:solid}
.viewfinder .frame i:nth-child(1){left:0;top:0;border-width:3px 0 0 3px;border-top-left-radius:10px}
.viewfinder .frame i:nth-child(2){right:0;top:0;border-width:3px 3px 0 0;border-top-right-radius:10px}
.viewfinder .frame i:nth-child(3){left:0;bottom:0;border-width:0 0 3px 3px;border-bottom-left-radius:10px}
.viewfinder .frame i:nth-child(4){right:0;bottom:0;border-width:0 3px 3px 0;border-bottom-right-radius:10px}
.viewfinder .laser{position:absolute;left:26%;right:26%;height:2px;background:linear-gradient(90deg,transparent,#fff,transparent);box-shadow:0 0 18px #fff;animation:scan 2.4s ease-in-out infinite;top:16%}
@keyframes scan{0%,100%{top:17%}50%{top:83%}}
.viewfinder .cta{position:relative;text-align:center;z-index:2}
.viewfinder .cta b{font-family:Montserrat,Inter,system-ui,sans-serif;font-size:16px;display:block}
.viewfinder .cta small{color:var(--muted)}
.viewfinder.over{border-color:#888}
.result{border-radius:18px;padding:26px;text-align:center;border:1px solid var(--line);background:#0e0e0e;min-height:210px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;transition:.2s}
.result .big-ic{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;margin-bottom:6px}
.result .big-ic svg{width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.result h2{font-family:Montserrat,Inter,system-ui,sans-serif;font-weight:800;margin:0;font-size:24px;letter-spacing:-.01em}
.result p{margin:0;color:var(--soft)}
.result.ok{border-color:#2b5a3d;background:radial-gradient(400px 200px at 50% 0,rgba(114,221,159,.12),#0e0e0e)}
.result.ok .big-ic{background:rgba(114,221,159,.15);color:var(--ok)}
.result.dup,.result.warn{border-color:#5a4a22;background:radial-gradient(400px 200px at 50% 0,rgba(232,191,95,.12),#0e0e0e)}
.result.dup .big-ic,.result.warn .big-ic{background:rgba(232,191,95,.15);color:var(--warn)}
.result.bad{border-color:#5a2626;background:radial-gradient(400px 200px at 50% 0,rgba(240,116,116,.13),#0e0e0e)}
.result.bad .big-ic{background:rgba(240,116,116,.15);color:var(--bad)}
.result.flash{animation:flash .5s ease}
@keyframes flash{0%{transform:scale(.97);opacity:.4}100%{transform:none;opacity:1}}
.counter{display:flex;align-items:baseline;gap:8px}
.counter .v{font-family:Montserrat,Inter,system-ui,sans-serif;font-weight:900;font-size:46px;letter-spacing:-.03em}
.counter .of{color:var(--muted);font-size:16px}

/* Vertical bar chart */
.vchart{display:flex;align-items:flex-end;gap:6px;height:170px;padding-top:10px;border-bottom:1px solid #262626}
.vchart .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;min-width:0}
.vchart .col .b{width:100%;max-width:38px;background:var(--metal);border-radius:6px 6px 2px 2px;min-height:2px;transition:height .6s}
.vchart .col .c{font-size:11px;color:#ddd;font-weight:600}
.vlabels{display:flex;gap:6px;margin-top:6px}
.vlabels span{flex:1;text-align:center;font-size:10.5px;color:var(--dim);min-width:0;overflow:hidden;white-space:nowrap}

/* Modal + toast */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(6px);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:40px 16px;overflow:auto}
.modal-bg.on{display:flex}
.modal{background:#0f0f0f;border:1px solid #2a2a2a;border-radius:20px;width:100%;max-width:560px;padding:24px;position:relative;animation:pop .2s ease}
.modal.wide{max-width:1020px}
@keyframes pop{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.modal h2{font-family:Montserrat,Inter,system-ui,sans-serif;font-weight:800;margin:0 0 4px;font-size:20px}
.modal .x{position:absolute;right:16px;top:16px}
.pass-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:22px;margin-top:16px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;font-size:13px;margin:14px 0}
.kv span{color:var(--muted)}
.kv b{font-weight:500;word-break:break-word}
.timeline{border-left:1px solid #2a2a2a;margin:8px 0 0 6px;padding-left:16px;display:flex;flex-direction:column;gap:12px;max-height:240px;overflow:auto}
.timeline div{position:relative;font-size:13px}
.timeline div::before{content:"";position:absolute;left:-20.5px;top:6px;width:8px;height:8px;border-radius:50%;background:#d9d9d9;box-shadow:0 0 0 3px #0f0f0f}
.timeline small{display:block;color:var(--dim);font-size:11.5px}

.toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:200}
.toast{background:#f1f1f1;color:#0a0a0a;padding:11px 16px;border-radius:12px;font-weight:600;font-size:13px;box-shadow:0 14px 40px rgba(0,0,0,.5);animation:pop .2s ease;max-width:360px}

.msg-row{cursor:pointer}
.type{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:6px;background:#1a1a1a;border:1px solid #2c2c2c;color:#ddd;white-space:nowrap}
.type.auto{background:#e9e9e9;color:#0a0a0a;border-color:transparent}
.ch{font-size:12px;color:var(--soft);display:inline-flex;align-items:center;gap:6px}
.ok-t{color:var(--ok)}.bad-t{color:var(--bad)}

.hide{display:none!important}
svg[viewBox="0 0 24 24"]{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-4px}
.viewfinder .cta svg{width:42px;height:42px;stroke-width:1.5;margin-bottom:8px;display:block;margin-inline:auto}
.empty svg{width:34px;height:34px;color:#666;display:block;margin:0 auto 6px}
.next .tile>svg{width:20px;height:20px;color:#ddd}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.mt{margin-top:16px}
.sp{height:16px}

@media (max-width:1180px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g6{grid-template-columns:repeat(3,minmax(0,1fr))}.g-main,.hero,.pass-grid,.scanner{grid-template-columns:1fr}.hero-art{min-height:180px}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;flex-direction:row;padding:6px;border-right:0;border-top:1px solid var(--line)}
  .brand,.side-event{display:none}
  .nav{flex-direction:row;width:100%;justify-content:space-around}
  .nav a{flex-direction:column;gap:2px;padding:7px 6px;font-size:10.5px}
  .nav .badge{display:none}
  main{padding:20px 16px 100px}

  .hero{padding:24px}.hero h2{font-size:26px}
  .bar-row{grid-template-columns:90px 1fr 60px}
  .ticket{flex-direction:column;text-align:center}
}

<body>

<script>
/* ============ Icons ============ */
const I={

  copy:'<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
  bolt:'<path d="M13 2 3 14h9l-1 8 10-12h-9z"/>',
  door:'<path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/>',
  reset:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>',
  wa:'<path d="M21 11.5a8.4 8.4 0 0 1-12.3 7.4L3 21l2.1-5.6A8.4 8.4 0 1 1 21 11.5z"/>',
  sms:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h8"/>'
};
const ic=(n,cls='')=>`<svg class="${cls}" viewBox="0 0 24 24">${I[n]||''}</svg>`;
const logo=(cls='')=>`<svg class="${cls}" viewBox="0 0 100 100"><use href="#kode-logo"/></svg>`;

/* ============ Helpers ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now=()=>Date.now();
const uid=()=>Math.random().toString(36).slice(2,10);
const rand=(a,b)=>a+Math.random()*(b-a);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const pct=(a,b)=>b?Math.round(a/b*100):0;
const EMAIL_RE=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
const ALPH='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
function fmtDate(d){if(!d)return'';const x=new Date(d+'T00:00:00');return isNaN(x)?d:x.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'})}
function fmtTime(t){return t?new Date(t).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}):''}
function fmtDT(t){return t?new Date(t).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):''}
function ago(t){const s=Math.max(0,(now()-t)/1000);if(s<45)return'just now';if(s<3600)return Math.round(s/60)+'m ago';if(s<86400)return Math.round(s/3600)+'h ago';return Math.round(s/86400)+'d ago'}
function toast(msg){const d=document.createElement('div');d.className='toast';d.textContent=msg;$('#toasts').appendChild(d);setTimeout(()=>{d.style.transition='.3s';d.style.opacity='0';setTimeout(()=>d.remove(),300)},3200)}

/* ============ State ============ */
const LS='kode-qr-system-v1';
const DEFAULT_TPL={
  subject:"You're invited: {{event}}",
  body:"Hi {{first_name}},\n\nYou're invited to {{event}} on {{date}} at {{time}} — {{venue}}.\n\nBelow is your personal QR pass. Show it at the entrance for instant check-in. Please confirm whether you can make it using the buttons below.\n\nSee you there,\n{{sender}}",
  accept:"Thanks {{first_name}} — you're confirmed for {{event}}! 🎉\n\nKeep this QR pass handy; it's your entry ticket. Doors open at {{time}} on {{date}}.\n\nPass ID: {{code}}\n{{venue}}",
  decline:"Hi {{first_name}}, sorry you can't make it to {{event}}. Thanks for letting us know — we hope to see you at the next one.\n\n— {{sender}}",
  reminder:"Hi {{first_name}}, a quick reminder that {{event}} is on {{date}} at {{time}}. We haven't received your RSVP yet — tap below to confirm your spot."
};
function freshState(){
  return{
    event:{name:'KODE Launch Night',date:'2026-12-10',time:'19:00',venue:'Dubai Design District, Building 7',sender:'The KODE Team',eventId:'EVT'+Math.random().toString(36).slice(2,6).toUpperCase()},
    tpl:{...DEFAULT_TPL},
    channels:{email:true,whatsapp:true,sms:false},
    guests:[],outbox:[],log:[],scans:[]
  };
}
let state=null;
try{state=JSON.parse(localStorage.getItem(LS))}catch(e){}
if(!state||!state.event||!Array.isArray(state.guests))state=freshState();
state.tpl={...DEFAULT_TPL,...state.tpl};
function persist(){try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}}
function commit(){persist();render()}
function log(type,text,gid,t=now()){state.log.unshift({t,type,text,gid});if(state.log.length>3000)state.log.length=3000}

let ui={guestQ:'',guestF:'all',msgF:'all',tplTab:'body',previewId:null,lastScan:null,sendProg:null,lastField:null};

function genCode(){let c;do{let s='';for(let i=0;i<8;i++)s+=ALPH[Math.floor(Math.random()*ALPH.length)];c='KD-'+s.slice(0,4)+'-'+s.slice(4)}while(state.guests.some(g=>g.code===c));return c}
const payload=g=>`KODE|${state.event.eventId}|${g.code}`;
function status(g){if(g.checkedInAt)return'checked';if(g.rsvp==='accepted')return'confirmed';if(g.rsvp==='declined')return'declined';if(g.bounced)return'bounced';if(g.openedAt)return'opened';if(g.sentAt)return'invited';return'pending'}
const ST={pending:'Not invited',invited:'Invited',bounced:'Bounced',opened:'Opened',confirmed:'Confirmed',declined:'Declined',checked:'Checked in'};
const pill=s=>`<span class="pill st-${s}">${ST[s]}</span>`;
function stats(){
  const G=state.guests,c={total:G.length,pending:0,invited:0,bounced:0,opened:0,confirmed:0,declined:0,checked:0};
  G.forEach(g=>c[status(g)]++);
  c.sent=G.filter(g=>g.sentAt).length;
  c.delivered=G.filter(g=>g.sentAt&&!g.bounced).length;
  c.openedAll=G.filter(g=>g.openedAt).length;
  c.accepted=G.filter(g=>g.rsvp==='accepted').length;
  c.declinedAll=G.filter(g=>g.rsvp==='declined').length;
  c.checkedAll=G.filter(g=>g.checkedInAt).length;
  c.noRsvp=G.filter(g=>g.sentAt&&!g.bounced&&!g.rsvp).length;
  c.autoreplies=state.outbox.filter(m=>m.kind.startsWith('auto')).length;
  c.invalid=G.filter(g=>!g.emailValid).length;
  return c;
}
function fill(str,g){
  const e=state.event,first=(g.name||'').trim().split(/\s+/)[0]||'there';
  const map={name:g.name,first_name:first,event:e.name,date:fmtDate(e.date),time:e.time,venue:e.venue,sender:e.sender,code:g.code,email:g.email,phone:g.phone,company:g.company||''};
  return String(str||'').replace(/\{\{\s*(\w+)\s*\}\}/g,(m,k)=>k in map?map[k]:m);
}

/* ============ QR ============ */
function makeQR(text){if(typeof qrcode!=='function')return null;const q=qrcode(0,'M');q.addData(text);q.make();return q}
function qrSvg(text){
  const q=makeQR(text);if(!q)return'<svg viewBox="0 0 10 10"><text x="1" y="6" font-size="2">QR lib offline</text></svg>';
  const n=q.getModuleCount(),m=3,T=n+m*2;let p='';
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))p+=`M${c+m} ${r+m}h1v1h-1z`;
  return`<svg viewBox="0 0 ${T} ${T}" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg"><rect width="${T}" height="${T}" fill="#fff"/><path d="${p}" fill="#000"/></svg>`;
}

/* ============ Downloads ============ */
let dl=null;
(async()=>{try{if(window.claude&&typeof window.claude.use==='function')dl=await window.claude.use('downloads')}catch(e){dl=null}})();
async function saveFile(name,blob){
  if(dl){
    try{await dl.save({filename:name,data:blob});toast('Saved '+name)}
    catch(e){const c=e&&e.code;toast(c==='declined'?'Download cancelled':c==='rate_limited'?'A download prompt is already open':'Download isn’t available in this view')}
    return;
  }
  try{const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);toast('Downloading '+name)}
  catch(e){toast('Download isn’t available in this view')}
}
async function copyText(t,msg){try{await navigator.clipboard.writeText(t);toast(msg||'Copied')}catch(e){openModal(`<h2>Copy</h2><p class="muted">Select and copy the text below.</p><textarea class="input" style="min-height:260px" readonly>${esc(t)}</textarea>`)}}

/* ============ Import ============ */
function detectCols(headers){
  const h=headers.map(x=>String(x??'').toLowerCase().trim());
  const f=re=>h.findIndex(x=>re.test(x));
  return{
    name:f(/^(full\s*)?name$|^guest|^attendee|^contact|الاسم|^name/),
    first:f(/first/),last:f(/last|surname|family/),
    email:f(/e-?mail|بريد/),
    phone:f(/phone|mobile|number|whats|tel|cell|رقم|هاتف|جوال/),
    company:f(/company|organi[sz]ation|^org|employer|شركة|business/)
  };
}
function importRows(rows,source){
  rows=rows.filter(r=>Array.isArray(r)&&r.some(c=>String(c??'').trim()!==''));
  if(!rows.length){toast('That file looks empty');return}
  let hi=-1,cols=null;
  for(let i=0;i<Math.min(rows.length,10);i++){const c=detectCols(rows[i]);if(c.email>=0&&(c.name>=0||c.first>=0)){hi=i;cols=c;break}}
  if(hi<0){cols={name:0,first:-1,last:-1,email:1,phone:2,company:3};
    const r0=rows[0].map(x=>String(x??''));if(!r0.some(x=>x.includes('@')))hi=0;}
  const data=rows.slice(hi+1);
  const seen=new Set(state.guests.map(g=>(g.email||'').toLowerCase()).filter(Boolean));
  const seenP=new Set(state.guests.map(g=>(g.phone||'').replace(/\D/g,'')).filter(Boolean));
  let added=0,dupes=[],invalid=[],skipped=0;const t=now();
  data.forEach(r=>{
    const get=i=>i>=0?String(r[i]??'').trim():'';
    let name=get(cols.name);if(!name)name=[get(cols.first),get(cols.last)].filter(Boolean).join(' ');
    const email=get(cols.email).toLowerCase(),phone=get(cols.phone),company=get(cols.company);
    if(!name&&!email&&!phone){skipped++;return}
    const pk=phone.replace(/\D/g,'');
    if((email&&seen.has(email))||(!email&&pk&&seenP.has(pk))){dupes.push(name||email);return}
    if(email)seen.add(email);if(pk)seenP.add(pk);
    const emailValid=EMAIL_RE.test(email);
    if(!emailValid)invalid.push(`${name||'(no name)'} — ${email||'no email'}`);
    state.guests.push({id:uid(),name:name||email.split('@')[0]||'Guest',email,phone,company,code:genCode(),emailValid,addedAt:t});
    added++;
  });
  log('import',`Imported ${added} guests from ${source}`,null,t);
  if(location.hash!=='#guests'&&location.hash!=='#invitations'){ui.keepModal=true;location.hash='guests'}
  commit();
  openModal(`
    <h2>Import complete</h2><p class="muted">${esc(source)}</p>
    <div class="grid g3 mt">
      <div class="card kpi"><div class="l">Added</div><div class="v">${added}</div><div class="s">unique QR passes issued</div></div>
      <div class="card kpi"><div class="l">Duplicates skipped</div><div class="v">${dupes.length}</div><div class="s">matched by email / phone</div></div>
      <div class="card kpi"><div class="l">Need attention</div><div class="v">${invalid.length}</div><div class="s">invalid or missing email</div></div>
    </div>
    ${invalid.length?`<div class="note" style="color:var(--warn)">${ic('alert')}<div><b>Check these emails</b> — they'll bounce on email but can still receive WhatsApp/SMS:<br>${invalid.slice(0,8).map(esc).join('<br>')}${invalid.length>8?'<br>…':''}</div></div>`:''}
    ${dupes.length?`<div class="note">${ic('info')}<div>Skipped duplicates: ${dupes.slice(0,8).map(esc).join(', ')}${dupes.length>8?'…':''}</div></div>`:''}
    <div class="row mt" style="justify-content:flex-end"><button class="btn" data-action="close-modal">Review guests</button><a class="btn pri" href="#invitations" data-action="close-modal">${ic('send')} Set up invitations</a></div>`);
}
async function handleImportFile(file){
  if(!file)return;
  if(typeof XLSX==='undefined'){toast('Spreadsheet reader failed to load');return}
  try{
    const buf=await file.arrayBuffer();
    const wb=XLSX.read(buf,{type:'array'});
    const ws=wb.Sheets[wb.SheetNames[0]];
    importRows(XLSX.utils.sheet_to_json(ws,{header:1,defval:''}),file.name);
  }catch(e){console.error(e);toast('Couldn’t read that file — use .xlsx, .xls or .csv')}
}

/* ============ Messaging engine ============ */
function activeChannels(){return Object.keys(state.channels).filter(k=>state.channels[k])}
const KIND={invite:'Invitation',reminder:'Reminder','auto-accept':'Auto-reply · Confirmed','auto-decline':'Auto-reply · Declined'};
function deliver(g,kind,t=now()){
  const ch=activeChannels();let ok=false;
  const subject=kind==='invite'?fill(state.tpl.subject,g):kind==='reminder'?`Reminder: ${state.event.name}`:kind==='auto-accept'?`You're confirmed — ${state.event.name}`:`RSVP received — ${state.event.name}`;
  const body=fill(kind==='invite'?state.tpl.body:kind==='reminder'?state.tpl.reminder:kind==='auto-accept'?state.tpl.accept:state.tpl.decline,g);
  ch.forEach(c=>{
    if(c!=='email'&&!g.phone)return;
    const st=(c==='email'&&!g.emailValid)?'bounced':'delivered';
    if(st==='delivered')ok=true;
    state.outbox.unshift({id:uid(),t,gid:g.id,kind,channel:c,to:c==='email'?(g.email||'—'):g.phone,subject,body,status:st});
  });
  if(kind==='invite'){g.sentAt=t;g.bounced=!ok}
  if(kind==='reminder')g.reminders=(g.reminders||0)+1;
  const lbl=KIND[kind];
  log(kind.startsWith('auto')?'auto':kind,ok?`${lbl} sent to ${g.name}`:`${lbl} to ${g.name} bounced`,g.id,t);
  return ok;
}
function setRsvp(g,v,t=now()){
  g.rsvp=v;g.rsvpAt=t;if(!g.openedAt)g.openedAt=t;
  log('rsvp',`${g.name} ${v==='accepted'?'confirmed attendance':'declined the invitation'}`,g.id,t);
  deliver(g,v==='accepted'?'auto-accept':'auto-decline',t+1500);
}
async function sendBatch(list,kind){
  if(ui.sendProg){toast('A send is already in progress');return}
  if(!list.length){toast(kind==='invite'?'Everyone has already been invited':'No one to remind');return}
  if(!activeChannels().length){toast('Turn on at least one channel');return}
  ui.sendProg={done:0,total:list.length,kind};render();
  let ok=0,bad=0;
  for(let i=0;i<list.length;i++){
    deliver(list[i],kind)?ok++:bad++;
    ui.sendProg.done=i+1;
    if(i%2===0||i===list.length-1){updateProg();await sleep(55)}
  }
  ui.sendProg=null;commit();
  toast(`${kind==='invite'?'Invitations':'Reminders'}: ${ok} delivered${bad?` · ${bad} bounced`:''}`);
}
function updateProg(){const p=ui.sendProg,el=$('#sendProg');if(!p||!el)return;el.querySelector('div').style.width=pct(p.done,p.total)+'%';const t=$('#sendProgT');if(t)t.textContent=`Sending ${p.kind==='invite'?'invitations':'reminders'}… ${p.done}/${p.total}`}
function simulateResponses(){
  const pool=state.guests.filter(g=>g.sentAt&&!g.bounced&&!g.rsvp);
  if(!pool.length){toast(state.guests.some(g=>g.sentAt)?'Everyone reachable has already responded':'Send invitations first');return}
  let o=0,a=0,d=0;const T=now();
  pool.forEach(g=>{
    if(g.openedAt||Math.random()<.82){
      if(!g.openedAt){g.openedAt=Math.min(T,g.sentAt+rand(20,900)*1000);log('open',`${g.name} opened the invitation`,g.id,g.openedAt);o++}
      const r=Math.random(),rt=Math.min(T,g.openedAt+rand(10,300)*1000);
      if(r<.72){setRsvp(g,'accepted',rt);a++}else if(r<.86){setRsvp(g,'declined',rt);d++}
    }
  });
  state.log.sort((x,y)=>y.t-x.t);state.outbox.sort((x,y)=>y.t-x.t);commit();
  toast(`${o} opened · ${a} confirmed · ${d} declined → ${a+d} auto-replies sent`);
}

/* ============ Check-in ============ */
function checkIn(g,gate,t=now()){g.checkedInAt=t;g.gate=gate;log('checkin',`${g.name} checked in at ${gate}`,g.id,t)}
function processScan(raw){
  raw=String(raw||'').trim();
  let code=null,evOk=true;
  const m=raw.match(/^KODE\|([^|]+)\|(KD-[A-Z0-9]{4}-[A-Z0-9]{4})$/i);
  if(m){code=m[2].toUpperCase();evOk=m[1]===state.event.eventId}
  else{const m2=raw.toUpperCase().replace(/\s/g,'').match(/^KD-?([A-Z0-9]{4})-?([A-Z0-9]{4})$/);if(m2)code=`KD-${m2[1]}-${m2[2]}`}
  const gate=($('#gateSel')||{}).value||'Main Gate';
  let res;
  if(!code)res={type:'bad',title:'Invalid QR code',sub:'This code wasn’t issued by KODE.'};
  else if(!evOk)res={type:'bad',title:'Wrong event',sub:'This pass belongs to a different event.'};
  else{
    const g=state.guests.find(x=>x.code===code);
    if(!g)res={type:'bad',title:'Pass not found',sub:`${code} isn’t on the guest list.`};
    else if(g.checkedInAt)res={type:'dup',title:'Already checked in',sub:`${g.name} entered at ${fmtTime(g.checkedInAt)} via ${g.gate}.`,gid:g.id};
    else if(g.rsvp==='declined')res={type:'warn',title:'Guest declined RSVP',sub:`${g.name} declined the invitation. Allow entry anyway?`,gid:g.id,override:true};
    else{checkIn(g,gate);res={type:'ok',title:'Access granted',sub:`Welcome, ${g.name}!${g.rsvp?'':' · no RSVP on file'}`,gid:g.id}}
  }
  res.t=now();res.gate=gate;
  state.scans.unshift({t:res.t,type:res.type,gid:res.gid||null,code:code||raw.slice(0,30)||'—',gate});
  if(state.scans.length>1000)state.scans.length=1000;
  ui.lastScan=res;commit();
  const r=$('#scanResult');if(r){r.classList.remove('flash');void r.offsetWidth;r.classList.add('flash')}
}
async function scanImage(file){
  if(!file)return;
  if(typeof jsQR!=='function'){toast('QR decoder failed to load');return}
  try{
    const bmp=await createImageBitmap(file);
    // Try the whole image, then progressively tighter crops — logos or text near the code can confuse detection
    const tries=[[0,0,1,1400],[0,0,1,800],[.1,.1,.8,1000],[.2,.15,.6,900],[.15,.25,.7,900],[.25,.3,.5,700]];
    let r=null;
    for(const [fx,fy,fw,max] of tries){
      const sw=bmp.width*fw,sh=bmp.height*fw,sx=bmp.width*fx,sy=bmp.height*fy;
      const sc=Math.min(1,max/Math.max(sw,sh));
      const c=document.createElement('canvas');c.width=Math.max(1,Math.round(sw*sc));c.height=Math.max(1,Math.round(sh*sc));
      const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(bmp,sx,sy,sw,sh,0,0,c.width,c.height);
      const d=x.getImageData(0,0,c.width,c.height);
      r=jsQR(d.data,c.width,c.height,{inversionAttempts:'attemptBoth'});
      if(r&&r.data)break;
    }
    if(r&&r.data)processScan(r.data);
    else{ui.lastScan={type:'bad',title:'No QR found',sub:'Couldn’t find a QR code in that image — try a closer, sharper photo.',t:now()};render()}
  }catch(e){toast('Couldn’t read that image')}
}
function simulateArrivals(){
  const pool=state.guests.filter(g=>g.rsvp==='accepted'&&!g.checkedInAt);
  if(!pool.length){toast('No confirmed guests waiting — simulate RSVPs first');return}
  const gates=['Main Gate','Main Gate','Main Gate','VIP Entrance','Gate B'];const T=now();let n=0;
  // Fast-forward to event night so the arrivals curve looks real
  const ev=new Date(state.event.date+'T'+(state.event.time||'19:00')).getTime(),base=isNaN(ev)?T-120*60000:ev;
  pool.forEach(g=>{if(Math.random()<.85){const t=base+rand(-15,120)*60000;checkIn(g,gates[Math.floor(Math.random()*gates.length)],t);state.scans.unshift({t,type:'ok',gid:g.id,code:g.code,gate:g.gate});n++}});
  state.log.sort((a,b)=>b.t-a.t);state.scans.sort((a,b)=>b.t-a.t);commit();toast(`Fast-forwarded to event night: ${n} guests checked in`);
}

function drawLogo(x,X,Y,S,color='#fff'){
  x.save();x.strokeStyle=color;x.fillStyle=color;x.lineWidth=S*.055;x.strokeRect(X+S*.05,Y+S*.05,S*.9,S*.9);
  x.font=`800 ${S*.36}px Montserrat, Arial Black, sans-serif`;x.textBaseline='alphabetic';
  const fit=(t,yy)=>{const w=x.measureText(t).width;x.save();x.translate(X+S*.18,yy);x.scale(S*.64/w,1);x.fillText(t,0,0);x.restore()};
  fit('KO',Y+S*.46);x.fillRect(X+S*.18,Y+S*.52,S*.64,S*.045);fit('DE',Y+S*.87);x.restore();
}
async function passBlob(g){
  try{await document.fonts.ready}catch(e){}
  const W=760,H=1120,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  x.fillStyle='#0a0a0a';x.fillRect(0,0,W,H);
  const gr=x.createLinearGradient(0,0,W,H);gr.addColorStop(0,'#fff');gr.addColorStop(.45,'#8e8e8e');gr.addColorStop(.75,'#dcdcdc');gr.addColorStop(1,'#f4f4f4');
  x.strokeStyle=gr;x.lineWidth=3;x.strokeRect(28,28,W-56,H-56);
  drawLogo(x,64,64,96);
  x.fillStyle='#8a8a8a';x.font='600 15px Inter, sans-serif';x.fillText('GUEST PASS',184,96);
  x.fillStyle='#fff';x.font='800 34px Montserrat, sans-serif';x.fillText(state.event.name.toUpperCase().slice(0,30),184,138);
  x.fillStyle='#c9c9c9';x.font='500 18px Inter, sans-serif';x.fillText(`${fmtDate(state.event.date)} · ${state.event.time}`,184,170);
  const q=makeQR(payload(g));const box=480,bx=(W-box)/2,by=230;
  x.fillStyle='#fff';x.beginPath();x.roundRect?x.roundRect(bx,by,box,box,22):x.rect(bx,by,box,box);x.fill();
  if(q){const n=q.getModuleCount(),cell=Math.floor(box/(n+8)),off=Math.round((box-cell*n)/2);x.fillStyle='#000';
    for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(q.isDark(r,k))x.fillRect(bx+off+k*cell,by+off+r*cell,cell,cell)}
  x.textAlign='center';
  x.fillStyle='#fff';x.font='800 40px Montserrat, sans-serif';x.fillText(g.name.slice(0,26),W/2,800);
  if(g.company){x.fillStyle='#9a9a9a';x.font='500 20px Inter, sans-serif';x.fillText(g.company,W/2,836)}
  x.fillStyle='#1a1a1a';x.fillRect(W/2-150,870,300,52);x.strokeStyle='#333';x.lineWidth=1;x.strokeRect(W/2-150,870,300,52);
  x.fillStyle='#fff';x.font='600 24px JetBrains Mono, monospace';x.fillText(g.code,W/2,905);
  x.fillStyle='#c9c9c9';x.font='500 18px Inter, sans-serif';x.fillText(state.event.venue.slice(0,60),W/2,980);
  x.fillStyle='#5c5c5c';x.font='500 14px Inter, sans-serif';x.fillText('Present this QR code at the entrance · Non-transferable',W/2,1040);
  return new Promise(r=>c.toBlob(r,'image/png'));
}

function arrivals(){
  const ts=state.guests.filter(g=>g.checkedInAt).map(g=>g.checkedInAt).sort((a,b)=>a-b);
  if(!ts.length)return null;
  const step=10*60000,start=Math.floor(ts[0]/step)*step,end=Math.floor(ts[ts.length-1]/step)*step;
  const n=Math.min(24,Math.round((end-start)/step)+1),b=Array.from({length:n},(_,i)=>({t:start+i*step,c:0}));
  ts.forEach(t=>{const i=Math.min(n-1,Math.floor((t-start)/step));b[i].c++});return b;
}
function vReports(s){
  if(!s.total)return`<div class="card empty">${ic('chart')}<p>Reports fill in as soon as you import guests. <a href="#guests">Import now</a></p></div>`;
  const arr=arrivals(),mx=arr?Math.max(...arr.map(x=>x.c)):0;
  const gates={};state.guests.forEach(g=>{if(g.checkedInAt)gates[g.gate]=(gates[g.gate]||0)+1});
  const comp={};state.guests.forEach(g=>{const k=g.company||'—';comp[k]=comp[k]||{t:0,a:0,c:0};comp[k].t++;if(g.rsvp==='accepted')comp[k].a++;if(g.checkedInAt)comp[k].c++});
  const noShows=state.guests.filter(g=>g.rsvp==='accepted'&&!g.checkedInAt).length;
  return`
  <div class="grid g6">
    ${kpi('Delivery rate',pct(s.delivered,s.sent)+'%',`${s.delivered} of ${s.sent} sent`,pct(s.delivered,s.sent))}
    ${kpi('Open rate',pct(s.openedAll,s.delivered)+'%',`${s.openedAll} opened`,pct(s.openedAll,s.delivered))}
    ${kpi('Response rate',pct(s.accepted+s.declinedAll,s.delivered)+'%',`${s.accepted+s.declinedAll} replied`,pct(s.accepted+s.declinedAll,s.delivered))}
    ${kpi('Acceptance',pct(s.accepted,s.accepted+s.declinedAll)+'%',`${s.accepted} yes · ${s.declinedAll} no`,pct(s.accepted,s.accepted+s.declinedAll))}
    ${kpi('Attendance',pct(s.checkedAll,s.accepted)+'%',`${s.checkedAll} checked in`,pct(s.checkedAll,s.accepted))}
    ${kpi('No-shows',noShows,'confirmed but not arrived',pct(noShows,s.accepted))}
  </div>
  <div class="grid g2 mt">
    <div class="card"><h3>Guests by status</h3><div class="bars">${Object.keys(ST).map(k=>barRow(ST[k],s[k],s.total)).join('')}</div></div>
    <div class="card"><h3>Arrivals over time<span class="sub">10-minute intervals</span></h3>
      ${arr?`<div class="vchart">${arr.map(x=>`<div class="col"><span class="c">${x.c||''}</span><div class="b" style="height:${mx?x.c/mx*100:0}%"></div></div>`).join('')}</div><div class="vlabels">${arr.map((x,i)=>`<span>${i%Math.ceil(arr.length/8)===0?fmtTime(x.t):''}</span>`).join('')}</div>`:'<div class="empty">No check-ins yet.</div>'}
      ${Object.keys(gates).length?`<div class="legend mt">${Object.entries(gates).sort((a,b)=>b[1]-a[1]).map(([g,n])=>`<div><span class="muted">${esc(g)}</span><b>${n}</b></div>`).join('')}</div>`:''}
    </div>
  </div>
  <div class="card mt"><h3>By company</h3><div class="tbl-wrap"><table><thead><tr><th>Company</th><th>Invited</th><th>Confirmed</th><th>Checked in</th><th>Attendance</th></tr></thead><tbody>
    ${Object.entries(comp).sort((a,b)=>b[1].t-a[1].t).map(([k,v])=>`<tr><td><b style="font-weight:600">${esc(k)}</b></td><td>${v.t}</td><td>${v.a}</td><td>${v.c}</td><td style="width:30%"><div class="bar-row" style="grid-template-columns:1fr 44px"><div class="track"><div class="fill" style="width:${pct(v.c,v.t)}%"></div></div><span class="n">${pct(v.c,v.t)}%</span></div></td></tr>`).join('')}
  </tbody></table></div></div>
  <div class="card mt"><h3>Full guest report<span class="sub">${s.total} guests</span></h3><div class="tbl-wrap" style="max-height:520px"><table><thead><tr><th>Guest</th><th>Contact</th><th>Code</th><th>Status</th><th>Invited</th><th>Opened</th><th>RSVP</th><th>Checked in</th><th>Gate</th></tr></thead><tbody>
    ${state.guests.map(g=>`<tr><td class="gname"><b>${esc(g.name)}</b><small>${esc(g.company||'')}</small></td><td class="gname"><b style="font-weight:400">${esc(g.email||'—')}</b><small>${esc(g.phone||'')}</small></td><td><span class="code">${g.code}</span></td><td>${pill(status(g))}</td><td class="muted">${fmtDT(g.sentAt)||'—'}</td><td class="muted">${fmtDT(g.openedAt)||'—'}</td><td class="muted">${g.rsvp?fmtDT(g.rsvpAt):'—'}</td><td class="muted">${fmtDT(g.checkedInAt)||'—'}</td><td class="muted">${esc(g.gate||'—')}</td></tr>`).join('')}
  </tbody></table></div></div>`;
}

/* ============ Exports ============ */
function guestRows(){return state.guests.map(g=>({'Name':g.name,'Email':g.email,'Phone':g.phone,'Company':g.company,'Pass code':g.code,'Status':ST[status(g)],'Email valid':g.emailValid?'Yes':'No','Invited at':fmtDT(g.sentAt),'Opened at':fmtDT(g.openedAt),'RSVP':g.rsvp?(g.rsvp==='accepted'?'Confirmed':'Declined'):'','RSVP at':fmtDT(g.rsvpAt),'Checked in at':fmtDT(g.checkedInAt),'Gate':g.gate||'','Reminders':g.reminders||0}))}
function summaryLines(){const s=stats(),e=state.event;return[
 ['Event',e.name],['Date',`${fmtDate(e.date)} ${e.time}`],['Venue',e.venue],['Generated',new Date().toLocaleString('en-GB')],[],
 ['Total guests',s.total],['Invitations sent',s.sent],['Delivered',s.delivered],['Bounced',s.bounced],['Opened',s.openedAll],['Confirmed',s.accepted],['Declined',s.declinedAll],['Awaiting RSVP',s.noRsvp],['Checked in',s.checkedAll],['No-shows',state.guests.filter(g=>g.rsvp==='accepted'&&!g.checkedInAt).length],
 [],['Delivery rate',pct(s.delivered,s.sent)+'%'],['Open rate',pct(s.openedAll,s.delivered)+'%'],['Acceptance rate',pct(s.accepted,s.accepted+s.declinedAll)+'%'],['Attendance rate',pct(s.checkedAll,s.accepted)+'%'],['Auto-replies sent',s.autoreplies]]}
function exportXlsx(){
  if(typeof XLSX==='undefined'){toast('Excel library failed to load');return}
  const wb=XLSX.utils.book_new();
  const ws1=XLSX.utils.aoa_to_sheet([['KODE — Event Report'],[],...summaryLines()]);ws1['!cols']=[{wch:22},{wch:44}];XLSX.utils.book_append_sheet(wb,ws1,'Summary');
  const ws2=XLSX.utils.json_to_sheet(guestRows());ws2['!cols']=[22,30,18,18,14,12,10,18,18,10,18,18,14,10].map(w=>({wch:w}));XLSX.utils.book_append_sheet(wb,ws2,'Guests');
  const ws3=XLSX.utils.json_to_sheet(state.outbox.map(m=>{const g=state.guests.find(x=>x.id===m.gid);return{'Time':fmtDT(m.t),'Type':KIND[m.kind],'Guest':g?g.name:'','Channel':m.channel,'To':m.to,'Subject':m.subject,'Status':m.status}}));XLSX.utils.book_append_sheet(wb,ws3,'Messages');
  const ws4=XLSX.utils.json_to_sheet(state.scans.map(x=>{const g=state.guests.find(y=>y.id===x.gid);return{'Time':fmtDT(x.t),'Result':x.type==='ok'?'Granted':x.type==='dup'?'Duplicate':x.type==='warn'?'Declined RSVP':'Rejected','Guest':g?g.name:'','Code':x.code,'Gate':x.gate}}));XLSX.utils.book_append_sheet(wb,ws4,'Scans');
  const ws5=XLSX.utils.json_to_sheet(state.log.map(l=>({'Time':fmtDT(l.t),'Event':l.text})));XLSX.utils.book_append_sheet(wb,ws5,'Activity');
  saveFile(`KODE-report-${state.event.name.replace(/[^\w]+/g,'-')}.xlsx`,new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})]));
}
function csvText(){const rows=guestRows();if(!rows.length)return'';const h=Object.keys(rows[0]);const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;return[h.map(q).join(','),...rows.map(r=>h.map(k=>q(r[k])).join(','))].join('\n')}

/* ============ Events ============ */
function afterRender(v){
  const gq=$('#gq');if(gq){gq.addEventListener('input',e=>{ui.guestQ=e.target.value;const p=e.target.selectionStart;render();const n=$('#gq');n.focus();n.setSelectionRange(p,p)})}
  const gf=$('#gf');if(gf)gf.addEventListener('change',e=>{ui.guestF=e.target.value;render()});
  document.querySelectorAll('.tplf').forEach(el=>{el.addEventListener('focus',()=>ui.lastField=el);el.addEventListener('input',()=>{state.tpl[el.dataset.k]=el.value;persist();$('#preview').innerHTML=previewHtml()})});
  document.querySelectorAll('.evf').forEach(el=>el.addEventListener('input',()=>{state.event[el.dataset.k]=el.value;persist();$('#preview').innerHTML=previewHtml()}));
  document.querySelectorAll('.evf').forEach(el=>el.addEventListener('change',()=>render()));
  const pv=$('#pvSel');if(pv)pv.addEventListener('change',e=>{ui.previewId=e.target.value;$('#preview').innerHTML=previewHtml()});
  const gs=$('#gateSel');if(gs)gs.addEventListener('change',e=>ui.gate=e.target.value);
  const mf=$('#manualForm');if(mf)mf.addEventListener('submit',e=>{e.preventDefault();const v=$('#manualCode').value;if(v.trim())processScan(v)});
  ['dropImport','vf'].forEach(id=>{const d=$('#'+id);if(!d)return;
    d.addEventListener('dragover',e=>{e.preventDefault();d.classList.add('over')});
    d.addEventListener('dragleave',()=>d.classList.remove('over'));
    d.addEventListener('drop',e=>{e.preventDefault();d.classList.remove('over');const f=e.dataTransfer.files[0];if(!f)return;id==='vf'?scanImage(f):handleImportFile(f)})});
}
$('#fileImport').addEventListener('change',e=>{handleImportFile(e.target.files[0]);e.target.value=''});
$('#fileScan').addEventListener('change',e=>{scanImage(e.target.files[0]);e.target.value=''});
window.addEventListener('hashchange',()=>{if(ui.keepModal)ui.keepModal=false;else closeModal();render();window.scrollTo(0,0)});

document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-action]');if(!el)return;
  const a=el.dataset.action,id=el.dataset.id,g=id?state.guests.find(x=>x.id===id):null;
  if(el.tagName==='A'&&el.getAttribute('href')==='#')e.preventDefault();
  switch(a){
    case 'close-modal':closeModal();break;
    case 'import':if(e.target.closest('a')&&e.target.closest('a').dataset.action==='load-sample')break;$('#fileImport').click();break;
    case 'load-sample':e.stopPropagation();importRows(SAMPLE.map(r=>r.slice()),'Sample guest list (26 rows)');break;
    case 'template':if(typeof XLSX==='undefined'){toast('Excel library failed to load');break}saveFile('KODE-guest-template.xlsx',templateBlob());break;
    case 'add-guest':openAddGuest();break;
    case 'view':e.preventDefault();openGuest(id);break;
    case 'send-one':if(!g)break;if(!activeChannels().length){toast('Turn on at least one channel');break}{const ok=deliver(g,'invite');commit();toast(ok?`Invitation sent to ${g.name}`:`Invitation to ${g.name} bounced`);if(ui.modalGuest===g.id)openGuest(g.id)}break;
    case 'checkin':if(!g)break;checkIn(g,ui.gate||'Main Gate');state.scans.unshift({t:now(),type:'ok',gid:g.id,code:g.code,gate:g.gate});commit();toast(`${g.name} checked in`);if(ui.modalGuest===g.id)openGuest(g.id);break;
    case 'override':if(!g)break;checkIn(g,($('#gateSel')||{}).value||'Main Gate');ui.lastScan={type:'ok',title:'Access granted',sub:`${g.name} allowed in (override).`,gid:g.id,t:now(),gate:g.gate};commit();break;
    case 'delete':if(!g)break;if(el.dataset.confirm!=='1'){el.dataset.confirm='1';el.style.color='var(--bad)';el.title='Click again to remove';toast('Click again to remove '+g.name);setTimeout(()=>{el.dataset.confirm='';el.style.color=''},2500);break}
      state.guests=state.guests.filter(x=>x.id!==id);log('import',`Removed ${g.name}`,null);commit();break;
    case 'send-all':sendBatch(state.guests.filter(x=>!x.sentAt),'invite');break;
    case 'remind':sendBatch(state.guests.filter(x=>x.sentAt&&!x.bounced&&!x.rsvp),'reminder');break;
    case 'simulate-responses':simulateResponses();break;
    case 'rsvp':if(!g)break;setRsvp(g,el.dataset.v);commit();toast(`${g.name} ${el.dataset.v==='accepted'?'confirmed':'declined'} → auto-reply sent`);openGuest(g.id);break;
    case 'download-pass':if(!g)break;{const b=await passBlob(g);if(b)saveFile(`KODE-pass-${g.name.replace(/[^\w]+/g,'-')}.png`,b)}break;
    case 'copy-code':if(g)copyText(g.code,'Pass code copied');break;
    case 'tpl-tab':ui.tplTab=el.dataset.k;render();break;
    case 'tpl-reset':state.tpl[ui.tplTab]=DEFAULT_TPL[ui.tplTab];if(ui.tplTab==='body')state.tpl.subject=DEFAULT_TPL.subject;commit();toast('Template reset');break;
    case 'ph':{const f=ui.lastField&&document.body.contains(ui.lastField)?ui.lastField:document.querySelector('textarea.tplf');if(!f)break;const s=f.selectionStart??f.value.length,en=f.selectionEnd??s;f.value=f.value.slice(0,s)+el.dataset.ph+f.value.slice(en);f.focus();f.setSelectionRange(s+el.dataset.ph.length,s+el.dataset.ph.length);f.dispatchEvent(new Event('input'))}break;
    case 'channel':state.channels[el.dataset.k]=el.checked;persist();break;
    case 'msg-f':ui.msgF=el.dataset.k;render();break;
    case 'msg':openMessage(id);break;
    case 'scan-upload':$('#fileScan').click();break;
    case 'scan-demo':{const k=el.dataset.k;let t=null;
      if(k==='valid'){const p=state.guests.filter(x=>!x.checkedInAt&&x.rsvp==='accepted');const q=p.length?p:state.guests.filter(x=>!x.checkedInAt&&x.rsvp!=='declined');if(!q.length){toast('No guests left to scan');break}t=payload(q[Math.floor(Math.random()*q.length)])}
      else if(k==='dup'){const p=state.guests.filter(x=>x.checkedInAt);if(!p.length){toast('Check someone in first');break}t=payload(p[Math.floor(Math.random()*p.length)])}
      else t='https://totally-real-tickets.biz/vip?id=12345';
      processScan(t)}break;
    case 'simulate-arrivals':simulateArrivals();break;
    case 'export-xlsx':exportXlsx();break;
    case 'export-csv':{const t=csvText();if(!t){toast('No guests yet');break}saveFile('KODE-guests.csv',new Blob([t],{type:'text/csv'}))}break;
    case 'copy-summary':copyText(summaryLines().map(r=>r.length?r.join(': '):'').join('\n'),'Summary copied');break;
    case 'reset':if(el.dataset.confirm!=='1'){el.dataset.confirm='1';el.innerHTML=`${ic('reset')} Click again to wipe all data`;setTimeout(()=>{if(document.body.contains(el)){el.dataset.confirm='';el.innerHTML=`${ic('reset')} Reset demo`}},3000);break}
      state=freshState();ui.lastScan=null;ui.previewId=null;commit();location.hash='dashboard';toast('Demo reset');break;
  }
});

render();
// Re-render once fonts & libs are ready so the logo and QR codes are crisp
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>{if(!$('#modalBg').classList.contains('on'))render()});
setInterval(()=>{if(cur()==='dashboard'&&!$('#modalBg').classList.contains('on')&&!ui.sendProg)render()},30000);
</script>
