<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KODE — QR Invitation & Access System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<style>
:root{
  --bg:#080808;--panel:#101010;--panel2:#151515;--panel3:#1b1b1b;
  --line:#222;--line2:#2e2e2e;--text:#f3f3f3;--soft:#c9c9c9;--muted:#8a8a8a;--dim:#5c5c5c;
  --metal:linear-gradient(135deg,#ffffff 0%,#cfcfcf 28%,#8e8e8e 52%,#d9d9d9 74%,#f4f4f4 100%);
  --metal-soft:linear-gradient(180deg,#e9e9e9,#a9a9a9);
  --ok:#72dd9f;--warn:#e8bf5f;--bad:#f07474;--info:#aab9ff;
  --r:16px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
body{background:
  radial-gradient(1200px 600px at 85% -10%,rgba(255,255,255,.06),transparent 60%),
  radial-gradient(800px 500px at -10% 110%,rgba(255,255,255,.035),transparent 60%),var(--bg);min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.app{display:grid;grid-template-columns:252px 1fr;min-height:100vh}

/* Sidebar */
.side{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:rgba(5,5,5,.85);backdrop-filter:blur(8px);padding:22px 14px;display:flex;flex-direction:column;gap:26px;z-index:30}
.brand{display:flex;align-items:center;gap:12px;padding:0 6px}
.brand svg{width:46px;height:46px;color:#fff;flex:none}
.brand b{font-family:Montserrat,Inter,system-ui,sans-serif;font-weight:900;letter-spacing:.32em;font-size:16px;display:block}
.brand small{display:block;color:var(--muted);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:11px;color:#a9a9a9;text-decoration:none;font-weight:500;transition:.15s}
.nav a:hover{background:#121212;color:#fff}
.nav a.on{background:#171717;color:#fff;box-shadow:inset 0 0 0 1px #262626}
.nav a.on .ico{color:#fff}
.nav .ico{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav .badge{margin-left:auto;font-size:11px;background:#1f1f1f;border:1px solid #2a2a2a;padding:0 8px;border-radius:99px;color:#d6d6d6;font-weight:600}
.side-event{margin-top:auto;border:1px solid var(--line);border-radius:14px;padding:14px;background:linear-gradient(180deg,#121212,#0b0b0b)}
.side-event .lbl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.side-event .nm{font-family:Montserrat,Inter,system-ui,sans-serif;font-weight:700;margin:4px 0 2px;font-size:14px}
.side-event .dt{color:var(--soft);font-size:12.5px}
.side-event .cd{margin-top:10px;font-size:12px;color:var(--muted)}
.side-event .cd b{color:#fff}

/* Main */
main{padding:28px 36px 60px;min-width:0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:24px;flex-wrap:wrap}
.top h1{font-family:Montserrat,Inter,system-ui,sans-serif;font-weight:800;font-size:28px;margin:0;letter-spacing:-.01em}
.top p{margin:4px 0 0;color:var(--muted)}
.top .acts{display:flex;gap:10px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line2);background:#131313;color:#eee;padding:9px 15px;border-radius:11px;cursor:pointer;font-weight:600;font-size:13.5px;transition:.15s;white-space:nowrap}
.btn{text-decoration:none}
.btn:hover{border-color:#4a4a4a;background:#191919}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--metal);color:#0a0a0a;border-color:transparent;box-shadow:0 6px 22px rgba(255,255,255,.08),inset 0 1px 0 rgba(255,255,255,.6)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--soft)}
.btn.ghost:hover{background:#151515}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:9px}
.btn.danger:hover{border-color:#5a2a2a;color:#ffb3b3}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

.card{background:linear-gradient(180deg,rgba(22,22,22,.92),rgba(14,14,14,.92));border:1px solid var(--line);border-radius:var(--r);padding:20px}
.card h3{font-family:Montserrat,Inter,system-ui,sans-serif;font-size:14px;font-weight:700;margin:0 0 14px;letter-spacing:.02em;display:flex;align-items:center;gap:10px}
.card h3 .sub{font-family:Inter;font-weight:500;color:var(--muted);font-size:12.5px;margin-left:auto}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
.eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* KPIs */
.kpi{padding:16px 18px;position:relative;overflow:hidden}
.kpi .l{font-size:12px;color:var(--muted);font-weight:500}
.kpi .v{font-family:Montserrat,Inter,system-ui,sans-serif;font-weight:800;font-size:30px;line-height:1.15;margin-top:6px;letter-spacing:-.02em}
.kpi .s{font-size:12px;color:var(--dim);margin-top:2px}
.kpi .bar{position:absolute;left:0;bottom:0;height:2px;background:var(--metal)}

/* Hero */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:30px;align-items:center;padding:38px;position:relative;overflow:hidden}
.hero h2{font-family:Montserrat,Inter,system-ui,sans-serif;font-weight:800;font-size:34px;line-height:1.12;margin:12px 0 14px;letter-spacing:-.02em}
.hero h2 em{font-style:normal;background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--soft);max-width:560px;margin:0 0 24px;font-size:15px}
.hero-art{display:flex;justify-content:center;align-items:center;position:relative;min-height:240px}
.hero-art .logo-big{width:210px;height:210px;color:#fff;filter:drop-shadow(0 20px 50px rgba(255,255,255,.08))}
.hero-art .mini-qr{position:absolute;right:8%;bottom:4%;width:96px;height:96px;padding:8px;background:#fff;border-radius:12px;transform:rotate(8deg);box-shadow:0 18px 40px rgba(0,0,0,.6)}
.hero-art .mini-qr svg{width:100%;height:100%;display:block}
.steps .card{padding:18px}
.steps .n{font-family:Montserrat,Inter,system-ui,sans-serif;font-weight:900;font-size:28px;background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent}
.steps b{display:block;margin:6px 0 4px;font-family:Montserrat}
.steps p{margin:0;color:var(--muted);font-size:13px}

/* Funnel / bars */
.bars{display:flex;flex-direction:column;gap:12px}
.bar-row{display:grid;grid-template-columns:120px 1fr 74px;gap:12px;align-items:center;font-size:13px}
.bar-row .t{color:var(--soft)}
.bar-row .track{height:10px;background:#1c1c1c;border-radius:99px;overflow:hidden}
.bar-row .fill{height:100%;background:var(--metal);border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar-row .n{text-align:right;font-variant-numeric:tabular-nums;color:#fff;font-weight:600}
.bar-row .n span{color:var(--dim);font-weight:500;margin-left:4px}

.ring-wrap{display:flex;align-items:center;gap:22px}
.ring{width:132px;height:132px;flex:none}
.ring .big{font-family:Montserrat,Inter,system-ui,sans-serif;font-weight:800;font-size:22px;fill:#fff}
.ring .sm{font-size:10px;fill:#8a8a8a;letter-spacing:.1em}
.legend div{display:flex;justify-content:space-between;gap:18px;padding:5px 0;border-bottom:1px dashed #222;font-size:13px}
.legend div:last-child{border:0}
.legend b{font-variant-numeric:tabular-nums}

/* Feed */
.feed{display:flex;flex-direction:column;max-height:380px;overflow:auto}
.feed .it{display:flex;gap:12px;padding:10px 2px;border-bottom:1px solid #1b1b1b;font-size:13px}
.feed .it:last-child{border:0}
.feed .dot{width:28px;height:28px;border-radius:9px;background:#1a1a1a;border:1px solid #282828;display:grid;place-items:center;flex:none}
.feed .dot svg{width:14px;height:14px;stroke:#d9d9d9;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.feed .tm{color:var(--dim);font-size:12px;margin-left:auto;white-space:nowrap}
.empty{padding:34px 10px;text-align:center;color:var(--muted)}

/* Next step tiles */
.next{display:flex;flex-direction:column;gap:10px}
.next .tile{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid #232323;border-radius:12px;background:#121212}
.next .tile .tx{flex:1;font-size:13px}
.next .tile .tx b{display:block;font-size:13.5px}

/* Table */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.input,select.input,textarea.input{background:#0d0d0d;border:1px solid var(--line2);border-radius:10px;padding:9px 12px;outline:none;transition:.15s;width:100%}
.input:focus{border-color:#6a6a6a;box-shadow:0 0 0 3px rgba(255,255,255,.06)}
.search{position:relative;flex:1;min-width:200px;max-width:360px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:#777;fill:none;stroke-width:2}
.search .input{padding-left:34px}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;padding:12px 14px;background:#0e0e0e;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
td{padding:11px 14px;border-bottom:1px solid #191919;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#121212}
.gname b{display:block;font-weight:600}
.gname small{color:var(--muted)}
.code{font-family:'JetBrains Mono',monospace;font-size:12px;color:#ddd;background:#171717;border:1px solid #262626;padding:2px 7px;border-radius:6px;white-space:nowrap}
.warn-txt{color:var(--warn);font-size:11.5px;display:block}
.acts-cell{display:flex;gap:4px;justify-content:flex-end}
.iconbtn{width:30px;height:30px;border-radius:8px;border:1px solid transparent;background:transparent;display:grid;place-items:center;cursor:pointer;color:#bbb}
.iconbtn:hover{background:#1b1b1b;border-color:#2c2c2c;color:#fff}
.iconbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:600;border:1px solid;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-pending{color:#9a9a9a;border-color:#2e2e2e;background:#141414}
.st-invited{color:#e6e6e6;border-color:#3a3a3a;background:#1a1a1a}
.st-bounced{color:var(--bad);border-color:#4a2424;background:#1d1212}
.st-opened{color:var(--info);border-color:#2f3556;background:#13151f}
.st-confirmed{color:var(--ok);border-color:#24442f;background:#111b15}
.st-declined{color:var(--warn);border-color:#4a3d1f;background:#1c1810}
.st-checked{color:#0a0a0a;border-color:transparent;background:var(--metal)}
.st-checked::before{background:#0a0a0a}

.drop{border:1.5px dashed #333;border-radius:16px;padding:30px;text-align:center;background:rgba(255,255,255,.015);transition:.15s;cursor:pointer}
.drop:hover,.drop.over{border-color:#8a8a8a;background:rgba(255,255,255,.04)}
.drop .ic{width:46px;height:46px;margin:0 auto 10px;border-radius:13px;display:grid;place-items:center;background:#161616;border:1px solid #2a2a2a}
.drop .ic svg{width:22px;height:22px;stroke:#eee;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.drop b{font-family:Montserrat,Inter,system-ui,sans-serif;font-size:15px}
.drop p{margin:6px 0 0;color:var(--muted);font-size:13px}

/* Forms */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.02em}
textarea.input{min-height:120px;resize:vertical;line-height:1.55}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{font-family:'JetBrains Mono',monospace;font-size:11.5px;padding:3px 8px;border-radius:7px;background:#161616;border:1px solid #2a2a2a;cursor:pointer;color:#cfcfcf}
.chip:hover{border-color:#555;color:#fff}
.tabs{display:flex;gap:4px;background:#0d0d0d;border:1px solid var(--line);padding:4px;border-radius:12px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:7px 12px;border-radius:9px;cursor:pointer;color:#9a9a9a;font-weight:600;font-size:12.5px}
.tabs button.on{background:#1e1e1e;color:#fff}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid #1b1b1b}
.toggle:last-child{border:0}
.toggle small{display:block;color:var(--muted);font-size:12px}
.sw{position:relative;width:40px;height:23px;flex:none}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:#262626;border-radius:99px;cursor:pointer;transition:.2s}
.sw span::after{content:"";position:absolute;left:3px;top:3px;width:17px;height:17px;border-radius:50%;background:#777;transition:.2s}
.sw input:checked+span{background:#d8d8d8}
.sw input:checked+span::after{left:20px;background:#0a0a0a}

.progress{height:8px;background:#1b1b1b;border-radius:99px;overflow:hidden;margin:12px 0 6px}
.progress div{height:100%;background:var(--metal);width:0;transition:width .15s}
.note{font-size:12px;color:var(--dim);display:flex;gap:8px;align-items:flex-start;margin-top:12px;line-height:1.45}
.note svg{width:14px;height:14px;flex:none;margin-top:2px;stroke:#777;fill:none;stroke-width:2}

/* Email preview */
.mail{background:#f6f6f6;color:#111;border-radius:16px;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.5)}
.mail-meta{background:#e9e9e9;padding:12px 18px;font-size:12px;color:#555;border-bottom:1px solid #ddd}
.mail-meta b{color:#111}
.mail-top{background:#0a0a0a;padding:26px 24px;display:flex;align-items:center;gap:14px;color:#fff}
.mail-top svg{width:46px;height:46px;color:#fff}
.mail-top .ev{font-family:Montserrat,Inter,system-ui,sans-serif;font-weight:800;font-size:17px}
.mail-top .ev small{display:block;font-family:Inter;font-weight:500;color:#aaa;font-size:12px}
.mail-body{padding:22px 24px 26px;white-space:pre-wrap;font-size:14px;line-height:1.6}
.ticket{margin:18px 0 6px;border:1px solid #ddd;border-radius:14px;background:#fff;display:flex;gap:18px;align-items:center;padding:16px;white-space:normal}
.ticket .q{width:150px;height:150px;flex:none}
.ticket .q svg{width:100%;height:100%;display:block}
.ticket .tn{font-family:Montserrat,Inter,system-ui,sans-serif;font-weight:800;font-size:17px}
.ticket .tm{font-size:12.5px;color:#555;margin-top:4px;line-height:1.5}
.ticket .tc{font-family:'JetBrains Mono',monospace;font-size:13px;margin-top:10px;background:#111;color:#fff;display:inline-block;padding:4px 9px;border-radius:7px;letter-spacing:.04em}
.rsvp{display:flex;gap:10px;margin-top:16px;white-space:normal}
.rsvp button{flex:1;padding:12px;border-radius:11px;font-weight:700;cursor:pointer;border:1px solid #111;font-size:14px}
.rsvp .yes{background:#0a0a0a;color:#fff}
.rsvp .no{background:#fff;color:#111}
.rsvp-done{margin-top:16px;padding:12px 14px;border-radius:11px;background:#eaf7ef;color:#16613a;font-weight:600;white-space:normal;display:flex;justify-content:space-between;align-items:center;gap:10px}
.rsvp-done.dec{background:#fbf3e3;color:#7a5a12}
.rsvp-done button{background:none;border:0;text-decoration:underline;cursor:pointer;color:inherit;font-size:12.5px}
.mail-foot{padding:14px 24px;font-size:11.5px;color:#888;border-top:1px solid #e3e3e3}

/* Scanner */
.scanner{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px}
.viewfinder{position:relative;aspect-ratio:4/3;border-radius:18px;background:#050505;border:1px solid #222;overflow:hidden;display:grid;place-items:center;cursor:pointer}
.viewfinder .frame{position:absolute;inset:16% 26%;}
.viewfinder .frame i{position:absolute;width:34px;height:34px;border-color:#e5e5e5;border-style:solid}
.viewfinder .frame i:nth-child(1){left:0;top:0;border-width:3px 0 0 3px;border-top-left-radius:10px}
.viewfinder .frame i:nth-child(2){right:0;top:0;border-width:3px 3px 0 0;border-top-right-radius:10px}
.viewfinder .frame i:nth-child(3){left:0;bottom:0;border-width:0 0 3px 3px;border-bottom-left-radius:10px}
.viewfinder .frame i:nth-child(4){right:0;bottom:0;border-width:0 3px 3px 0;border-bottom-right-radius:10px}
.viewfinder .laser{position:absolute;left:26%;right:26%;height:2px;background:linear-gradient(90deg,transparent,#fff,transparent);box-shadow:0 0 18px #fff;animation:scan 2.4s ease-in-out infinite;top:16%}
@keyframes scan{0%,100%{top:17%}50%{top:83%}}
.viewfinder .cta{position:relative;text-align:center;z-index:2}
.viewfinder .cta b{font-family:Montserrat,Inter,system-ui,sans-serif;font-size:16px;display:block}
.viewfinder .cta small{color:var(--muted)}
.viewfinder.over{border-color:#888}
.result{border-radius:18px;padding:26px;text-align:center;border:1px solid var(--line);background:#0e0e0e;min-height:210px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;transition:.2s}
.result .big-ic{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;margin-bottom:6px}
.result .big-ic svg{width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.result h2{font-family:Montserrat,Inter,system-ui,sans-serif;font-weight:800;margin:0;font-size:24px;letter-spacing:-.01em}
.result p{margin:0;color:var(--soft)}
.result.ok{border-color:#2b5a3d;background:radial-gradient(400px 200px at 50% 0,rgba(114,221,159,.12),#0e0e0e)}
.result.ok .big-ic{background:rgba(114,221,159,.15);color:var(--ok)}
.result.dup,.result.warn{border-color:#5a4a22;background:radial-gradient(400px 200px at 50% 0,rgba(232,191,95,.12),#0e0e0e)}
.result.dup .big-ic,.result.warn .big-ic{background:rgba(232,191,95,.15);color:var(--warn)}
.result.bad{border-color:#5a2626;background:radial-gradient(400px 200px at 50% 0,rgba(240,116,116,.13),#0e0e0e)}
.result.bad .big-ic{background:rgba(240,116,116,.15);color:var(--bad)}
.result.flash{animation:flash .5s ease}
@keyframes flash{0%{transform:scale(.97);opacity:.4}100%{transform:none;opacity:1}}
.counter{display:flex;align-items:baseline;gap:8px}
.counter .v{font-family:Montserrat,Inter,system-ui,sans-serif;font-weight:900;font-size:46px;letter-spacing:-.03em}
.counter .of{color:var(--muted);font-size:16px}

/* Vertical bar chart */
.vchart{display:flex;align-items:flex-end;gap:6px;height:170px;padding-top:10px;border-bottom:1px solid #262626}
.vchart .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;min-width:0}
.vchart .col .b{width:100%;max-width:38px;background:var(--metal);border-radius:6px 6px 2px 2px;min-height:2px;transition:height .6s}
.vchart .col .c{font-size:11px;color:#ddd;font-weight:600}
.vlabels{display:flex;gap:6px;margin-top:6px}
.vlabels span{flex:1;text-align:center;font-size:10.5px;color:var(--dim);min-width:0;overflow:hidden;white-space:nowrap}

/* Modal + toast */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(6px);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:40px 16px;overflow:auto}
.modal-bg.on{display:flex}
.modal{background:#0f0f0f;border:1px solid #2a2a2a;border-radius:20px;width:100%;max-width:560px;padding:24px;position:relative;animation:pop .2s ease}
.modal.wide{max-width:1020px}
@keyframes pop{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.modal h2{font-family:Montserrat,Inter,system-ui,sans-serif;font-weight:800;margin:0 0 4px;font-size:20px}
.modal .x{position:absolute;right:16px;top:16px}
.pass-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:22px;margin-top:16px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;font-size:13px;margin:14px 0}
.kv span{color:var(--muted)}
.kv b{font-weight:500;word-break:break-word}
.timeline{border-left:1px solid #2a2a2a;margin:8px 0 0 6px;padding-left:16px;display:flex;flex-direction:column;gap:12px;max-height:240px;overflow:auto}
.timeline div{position:relative;font-size:13px}
.timeline div::before{content:"";position:absolute;left:-20.5px;top:6px;width:8px;height:8px;border-radius:50%;background:#d9d9d9;box-shadow:0 0 0 3px #0f0f0f}
.timeline small{display:block;color:var(--dim);font-size:11.5px}

.toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:200}
.toast{background:#f1f1f1;color:#0a0a0a;padding:11px 16px;border-radius:12px;font-weight:600;font-size:13px;box-shadow:0 14px 40px rgba(0,0,0,.5);animation:pop .2s ease;max-width:360px}

.msg-row{cursor:pointer}
.type{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:6px;background:#1a1a1a;border:1px solid #2c2c2c;color:#ddd;white-space:nowrap}
.type.auto{background:#e9e9e9;color:#0a0a0a;border-color:transparent}
.ch{font-size:12px;color:var(--soft);display:inline-flex;align-items:center;gap:6px}
.ok-t{color:var(--ok)}.bad-t{color:var(--bad)}


/* ===== Guest experience ===== */
.plus{font-size:10.5px;background:#e9e9e9;color:#0a0a0a;border-radius:5px;padding:1px 6px;font-weight:800;margin-left:6px;vertical-align:1px}
.gv-bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.stepper{display:flex;gap:6px;flex:1;min-width:320px}
.stepper div{flex:1;padding:10px 12px;border-radius:12px;border:1px solid #222;background:#0f0f0f;font-size:12.5px;color:#6f6f6f;display:flex;gap:9px;align-items:center;font-weight:600;white-space:nowrap}
.stepper b{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#1c1c1c;font-size:11px;flex:none;color:#999}
.stepper .done{color:#d9d9d9}.stepper .done b{background:#e9e9e9;color:#0a0a0a}
.stepper .act{border-color:#555;color:#fff;background:#171717}.stepper .act b{background:var(--metal);color:#0a0a0a}
.gv-ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.gv-ctrl .tabs{margin:0}
.gv-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.gv-stage.phone{display:flex;justify-content:center}
.door{display:flex;gap:10px;align-items:flex-start;margin-top:12px;padding:12px;border-radius:12px;border:1px solid;font-size:13px}
.door svg{margin-top:2px}
.door span{color:var(--soft)}
.door.ok{border-color:#2b5a3d;background:#0f1912;color:var(--ok)}
.door.dup,.door.warn{border-color:#5a4a22;background:#19150d;color:var(--warn)}
.door.bad{border-color:#5a2626;background:#1a0f0f;color:var(--bad)}
.exit-present{position:fixed;top:14px;right:14px;z-index:60;display:none}
body.present .side,body.present .top{display:none}
body.present .app{grid-template-columns:1fr}
body.present .exit-present{display:inline-flex}

/* Mail client mock */
.mc{background:#fff;color:#1a1a1a;border-radius:14px;overflow:hidden;display:flex;flex-direction:column;height:800px;box-shadow:0 30px 80px rgba(0,0,0,.55);border:1px solid #2a2a2a}
.mc-top,.br-bar{height:48px;background:#f2f2f2;border-bottom:1px solid #e3e3e3;display:flex;align-items:center;gap:8px;padding:0 14px;flex:none;color:#333}
.mc-top>i,.br-bar>i{width:11px;height:11px;border-radius:50%;background:#d4d4d4;display:block;flex:none}
.mc-search{margin:0 auto;background:#fff;border:1px solid #e1e1e1;border-radius:8px;padding:5px 12px;color:#999;font-size:12.5px;width:min(360px,50%);display:flex;align-items:center;gap:8px}
.mc-me{width:28px;height:28px;border-radius:50%;background:#0a0a0a;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;flex:none}
.mc-main{flex:1;display:grid;grid-template-columns:300px 1fr;min-height:0}
.mc-list{border-right:1px solid #ececec;overflow:auto;background:#fafafa}
.mc-lh{padding:14px 16px 10px;font-weight:700;font-size:13px;display:flex;gap:8px;align-items:center;font-family:Montserrat,Inter,sans-serif}
.mc-lh span{background:#0a0a0a;color:#fff;border-radius:99px;font-size:11px;padding:0 7px}
.mc-item{display:flex;gap:10px;padding:12px 14px 12px 16px;border-bottom:1px solid #efefef;cursor:pointer;position:relative;animation:pop .3s ease}
.mc-item:hover{background:#f2f2f2}.mc-item.on{background:#e8e8e8}
.mc-item.unread::before{content:"";position:absolute;left:6px;top:22px;width:6px;height:6px;border-radius:50%;background:#0a0a0a}
.mc-av,.mr-av{width:34px;height:34px;border-radius:50%;background:#0a0a0a;display:grid;place-items:center;flex:none}
.mc-av svg,.mr-av svg{width:22px;height:22px;color:#fff}
.mc-it{min-width:0;flex:1}
.mc-r1{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.mc-r1 b{font-weight:600}
.mc-r1 span{color:#999;font-size:11.5px;white-space:nowrap}
.mc-sub{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#333}
.mc-item.unread .mc-sub,.mc-item.unread .mc-r1 b{font-weight:800;color:#000}
.mc-pre{font-size:12px;color:#8a8a8a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc-read{overflow:auto;background:#fff;min-width:0}
.mc-none{display:grid;place-items:center;align-content:center;gap:10px;color:#aaa}
.mc-none svg{width:64px;height:64px;color:#e2e2e2}
.mc-empty{padding:40px 16px;text-align:center;color:#999;display:flex;flex-direction:column;align-items:center;gap:12px}
.mc-empty svg{width:34px;height:34px;color:#ccc}
.mr-head{padding:20px 24px 14px;border-bottom:1px solid #f0f0f0}
.mr-head h2{font-family:Montserrat,Inter,sans-serif;font-size:20px;margin:0 0 14px;color:#111;font-weight:700}
.mr-from{display:flex;gap:10px;align-items:center;font-size:13px;color:#333}
.mr-from span{color:#8a8a8a}
.mr-t{margin-left:auto;font-size:12px;white-space:nowrap}
.mc-back{border:0;background:none;padding:12px 16px 0;font-weight:700;color:#0a0a0a;cursor:pointer;font-size:14px}
.gv-stage.phone>.mc,.gv-stage.phone>.br{width:392px;height:820px;border-radius:48px;border:11px solid #1b1b1b;box-shadow:0 0 0 2px #343434,0 40px 90px rgba(0,0,0,.65)}
.gv-stage.phone .mc-top>i,.gv-stage.phone .br-bar>i,.gv-stage.phone .mc-search{display:none}
.gv-stage.phone .mc-top,.gv-stage.phone .br-bar{padding-top:6px}
.mc.phone .mc-main{grid-template-columns:1fr}
.mc.phone.has-sel .mc-list{display:none}
.mc.phone:not(.has-sel) .mc-read{display:none}
.mc.phone .em-wrap{padding:0}
.mc.phone .em{border-radius:0;box-shadow:none}
.mc.phone .em-body,.mc.phone .em-head,.mc.phone .em-hero,.mc.phone .em-foot{padding-left:18px;padding-right:18px}
.mc.phone .em-hero h1{font-size:25px}
.mc.phone .em-pass{flex-direction:column;text-align:center}
.mc.phone .em-btns a{min-width:0;width:100%}
.mc.phone .em-det td:first-child{width:92px}
.mc.phone .mr-head{padding:12px 16px}
.mc.phone .mr-head h2{font-size:17px}
.mc.phone .mr-t{display:none}
.chat{background:#efeae2;padding:22px;border-radius:12px}
.chat .bub{background:#fff;border-radius:10px;padding:12px 14px;max-width:440px;white-space:pre-wrap;font-size:14px;color:#111;box-shadow:0 1px 1px rgba(0,0,0,.08)}

/* Email template */
.em-wrap{background:#efefef;padding:24px 16px}
.em{max-width:600px;margin:0 auto;background:#fff;color:#1d1d1d;border-radius:4px;overflow:hidden;font:15px/1.65 Inter,Arial,sans-serif;box-shadow:0 1px 4px rgba(0,0,0,.08);text-align:left}
.em a{cursor:pointer}
.em-head{background:#0a0a0a;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:20px 32px 6px}
.em-head svg{width:42px;height:42px;color:#fff}
.em-head span{font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:#9a9a9a;font-weight:600}
.em-hero{background:#0a0a0a;color:#fff;padding:22px 32px 40px;text-align:center;position:relative}
.em-hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,#5e5e5e,#f4f4f4,#8a8a8a,#e8e8e8,#5e5e5e)}
.em-eyebrow{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:#bdbdbd;font-weight:600}
.em-hero h1{font-family:Montserrat,Arial,sans-serif;font-weight:800;font-size:31px;line-height:1.15;margin:10px 0 10px;letter-spacing:-.01em;color:#fff}
.em-hero p{margin:0;color:#b5b5b5;font-size:14px}
.em-badge{width:48px;height:48px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;background:linear-gradient(135deg,#fff,#a3a3a3);color:#0a0a0a;font-weight:900;font-size:22px}
.em-body{padding:32px 32px 12px}
.em-body p{margin:0 0 14px}
.em-det{width:100%;border-collapse:collapse;margin:22px 0;border-top:1px solid #e7e7e7}
.em-det td{padding:12px 0;border-bottom:1px solid #e7e7e7;font-size:14.5px;vertical-align:top}
.em-det td:first-child{width:128px;color:#8a8a8a;font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;padding-top:15px}
.em-det td b{font-weight:600}
.em-rsvp{background:#f5f5f5;border-radius:6px;padding:24px 22px;text-align:center;margin:24px 0}
.em-q{font-family:Montserrat,Arial,sans-serif;font-weight:800;font-size:18px;color:#0a0a0a}
.em-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:16px 0}
.em-btns a{display:inline-block;padding:13px 22px;border-radius:4px;font-weight:700;font-size:14px;text-decoration:none;min-width:200px;text-align:center;transition:.15s}
.em-yes{background:#0a0a0a;color:#fff!important;border:1.5px solid #0a0a0a}
.em-yes:hover{background:#2a2a2a}
.em-no{background:#fff;color:#0a0a0a!important;border:1.5px solid #0a0a0a}
.em-no:hover{background:#f0f0f0}
.em-small{font-size:12.5px;color:#7a7a7a;line-height:1.55}
.em-status{padding:15px 16px;border-radius:6px;background:#edf7f0;color:#17653b;font-weight:600;font-size:14px;margin:22px 0;text-align:center}
.em-status.declined{background:#fbf4e4;color:#7a5a12}
.em-status a{color:inherit;text-decoration:underline}
.em-pass{display:flex;gap:22px;align-items:center;border:1px solid #e3e3e3;border-radius:8px;padding:18px;margin:24px 0;background:linear-gradient(180deg,#fff,#f8f8f8)}
.em-passes .em-pass{margin:14px 0}
.em-qr{width:140px;height:140px;flex:none;margin:0 auto}
.em-qr svg{width:100%;height:100%;display:block}
.em-lbl{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:#8a8a8a;font-weight:800}
.em-pn{font-family:Montserrat,Arial,sans-serif;font-weight:800;font-size:19px;margin:4px 0 8px;color:#0a0a0a}
.em-code{font-family:'JetBrains Mono',monospace;font-size:13px;background:#0a0a0a;color:#fff;display:inline-block;padding:4px 10px;border-radius:4px;letter-spacing:.06em;margin-bottom:8px}
.em-cal{font-size:13px;color:#7a7a7a;text-align:center;margin:6px 0 22px}
.em-cal a{color:#0a0a0a;font-weight:700}
.em-expect{background:#f5f5f5;border-radius:6px;padding:16px 20px;font-size:14px;margin:20px 0}
.em-expect ul{margin:8px 0 0;padding-left:18px}
.em-expect li{margin:3px 0}
.em-sign{margin-top:24px!important}
.em-foot{background:#0a0a0a;color:#8a8a8a;font-size:11.5px;line-height:1.65;padding:24px 32px;display:flex;gap:16px;align-items:center}
.em-foot svg{width:32px;height:32px;color:#fff;flex:none}
.em-foot a{color:#bdbdbd;text-decoration:underline}

/* RSVP landing page */
.br{background:#0a0a0a;border-radius:14px;overflow:hidden;height:800px;display:flex;flex-direction:column;border:1px solid #2a2a2a;box-shadow:0 30px 80px rgba(0,0,0,.55)}
.br-url{margin:0 auto;background:#fff;border:1px solid #e1e1e1;border-radius:8px;padding:5px 14px;font-size:12.5px;color:#444;display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;overflow:hidden}
.br-url svg{width:13px;height:13px;color:#2a8a4a;flex:none}
.br-x{border:0;background:none;cursor:pointer;color:#666;display:grid;place-items:center;padding:4px}
.rp{flex:1;overflow:auto;padding:42px 24px;display:flex;flex-direction:column;align-items:center;background:radial-gradient(600px 320px at 50% 0,rgba(255,255,255,.09),transparent),#0a0a0a;color:#fff}
.rp-logo{width:66px;height:66px;color:#fff;margin-bottom:18px;flex:none}
.rp-ev{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#9a9a9a;text-align:center;font-weight:600}
.rp h2{font-family:Montserrat,Inter,sans-serif;font-weight:800;font-size:30px;margin:12px 0 6px;text-align:center;letter-spacing:-.01em}
.rp-sub{color:#bdbdbd;margin:0 0 24px;text-align:center}
.rp-card{width:100%;max-width:470px;background:#131313;border:1px solid #2a2a2a;border-radius:18px;padding:24px}
.rp-l{display:block;font-size:12px;font-weight:600;color:#bdbdbd;margin:18px 0 8px}
.rp-card>.rp-l:first-child{margin-top:0}
.rp-l span{color:#6a6a6a;font-weight:500}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#0b0b0b;border:1px solid #262626;border-radius:12px;padding:4px}
.seg button{border:0;background:transparent;color:#a5a5a5;padding:11px 8px;border-radius:9px;font-weight:700;cursor:pointer;font-size:13.5px}
.seg button.on{background:var(--metal);color:#0a0a0a}
.rp-in{width:100%;background:#0b0b0b;border:1px solid #2e2e2e;border-radius:10px;padding:11px 12px;color:#fff;outline:none;font:inherit;font-size:14px}
.rp-in:focus{border-color:#7a7a7a}
.rp-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rp-grid .rp-l{margin-top:14px}
.rp-submit{width:100%;margin-top:22px;padding:14px;border:0;border-radius:12px;background:var(--metal);color:#0a0a0a;font-weight:800;font-size:15px;cursor:pointer;font-family:Montserrat,Inter,sans-serif}
.rp-fine{font-size:12px;color:#6a6a6a;text-align:center;margin-top:12px}
.rp-note{font-size:13px;color:#8a8a8a;margin-top:14px}
.rp-done{text-align:center;max-width:420px;margin-top:16px}
.rp-done p{color:#c9c9c9}
.rp-check{width:76px;height:76px;border-radius:50%;background:var(--metal);display:grid;place-items:center;margin:0 auto 18px;animation:pop .4s ease}
.rp-check svg{width:36px;height:36px;color:#0a0a0a;stroke-width:3}
.rp-spin{width:22px;height:22px;border:2px solid #333;border-top-color:#fff;border-radius:50%;margin:22px auto 8px;animation:spin .8s linear infinite}
.rp-done small{color:#7a7a7a}
@keyframes spin{to{transform:rotate(360deg)}}
.br.phone .rp-grid{grid-template-columns:1fr}
.br.phone .rp h2{font-size:24px}
.br.phone .rp{padding:30px 16px}
@media (max-width:1180px){.gv-grid{grid-template-columns:1fr}}
@media (max-width:700px){.mc-main{grid-template-columns:1fr}.mc:not(.has-sel) .mc-read{display:none}.mc.has-sel .mc-list{display:none}.rp-grid{grid-template-columns:1fr}.em-pass{flex-direction:column;text-align:center}}

.em-banner{display:block;width:100%;height:auto;background:#0a0a0a}
.bn-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.bn{position:relative;border:1.5px solid #2a2a2a;border-radius:12px;overflow:hidden;cursor:pointer;background:#0b0b0b;aspect-ratio:12/5;display:grid;place-items:center;color:#9a9a9a;font-size:12px;font-weight:600;padding:0}
.bn img{width:100%;height:100%;object-fit:cover;display:block}
.bn:hover{border-color:#666}
.bn.on{border-color:#e5e5e5;box-shadow:0 0 0 3px rgba(255,255,255,.12)}
.bn.on::after{content:"✓";position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:50%;background:#fff;color:#0a0a0a;font-size:11px;font-weight:900;display:grid;place-items:center}
.bn .bn-l{position:absolute;left:0;right:0;bottom:0;padding:4px 8px;font-size:11px;background:linear-gradient(transparent,rgba(0,0,0,.8));color:#ddd;text-align:left}
.bn.up{border-style:dashed;flex-direction:column;gap:4px;display:flex;align-items:center;justify-content:center}
.bn.up svg{width:20px;height:20px}
@media (max-width:860px){
  .gv-stage.phone>.mc,.gv-stage.phone>.br{width:100%;max-width:392px;border-width:7px;border-radius:30px;height:720px}
  .mc,.br{height:720px}
  .stepper{display:grid;grid-template-columns:1fr 1fr;min-width:0;width:100%}
  .stepper div{white-space:normal}
  .gv-ctrl{width:100%}
  .bn-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
.dots{display:inline-flex;gap:4px;vertical-align:middle}
.dots i{width:11px;height:11px;border-radius:3px;background:#242424;border:1px solid #333;display:block}
.dots i.on{background:var(--metal);border-color:transparent}
.sess-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.sess{border:1px solid #262626;background:#0f0f0f;border-radius:14px;padding:12px 14px;cursor:pointer;text-align:left;color:#bbb;font:inherit}
.sess b{display:block;color:#fff;font-family:Montserrat,Inter,sans-serif;font-size:14px}
.sess small{display:block;color:#7a7a7a;font-size:12px;margin-top:2px}
.sess .cnt{font-size:12px;margin-top:8px;color:#aaa}
.sess.on{border-color:#d9d9d9;background:#171717;box-shadow:0 0 0 3px rgba(255,255,255,.08)}
.sess.on b::before{content:"● ";color:var(--ok)}
.netbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;font-size:12.5px;color:var(--soft)}
.net{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:99px;border:1px solid #2a4a35;background:#0f1912;color:var(--ok);font-weight:600}
.net.off{border-color:#5a4a22;background:#19150d;color:var(--warn)}
.net::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.prog{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.prog span{font-size:11px;font-weight:700;padding:4px 9px;border-radius:7px;background:#1a1a1a;border:1px solid #2c2c2c;color:#777}
.prog span.on{background:#e9e9e9;color:#0a0a0a;border-color:transparent}
.prog span.cur{outline:2px solid var(--ok);outline-offset:1px}
.att-cell{font-size:12.5px;color:#e5e5e5;white-space:nowrap;font-weight:600}
.att-cell.no{color:#4a4a4a}
.att-cell small{display:block;color:var(--dim);font-size:11px;font-weight:500}
.att-cell .m{font-size:10px;background:#2a2a2a;border-radius:4px;padding:0 4px;margin-left:4px;color:#ccc}

.em-certnote{margin-top:12px;background:#0a0a0a;color:#fff;border-radius:6px;padding:12px 14px;font-size:13.5px;font-weight:600}
.em-cert{margin:20px 0;border:1px solid #e3e3e3;border-radius:6px;overflow:hidden}
.em-cert img{width:100%;display:block}
.em-attach{display:inline-flex;align-items:center;gap:8px;border:1px solid #ddd;border-radius:6px;padding:9px 12px;font-size:13px;font-weight:600;background:#fafafa;margin-bottom:14px}
.em-done{list-style:none;padding:0;margin:10px 0 18px}
.em-done li{padding:6px 0;border-bottom:1px solid #f0f0f0;font-size:14px}
.em-done li::before{content:"✓  ";font-weight:900}
@media (max-width:860px){.sess-bar{grid-template-columns:1fr 1fr}.nav{overflow-x:auto;justify-content:flex-start}.nav a{min-width:60px}}

@media (max-width:600px){.walk-ok{grid-template-columns:1fr}.walk-ok .q{max-width:240px;margin:0 auto}}
.hide{display:none!important}
svg[viewBox="0 0 24 24"]{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-4px}

.mt{margin-top:16px}

@media (max-width:1180px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g6{grid-template-columns:repeat(3,minmax(0,1fr))}.g-main,.hero,.pass-grid,.scanner{grid-template-columns:1fr}.hero-art{min-height:180px}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;flex-direction:row;padding:6px;border-right:0;border-top:1px solid var(--line)}
  .brand,.side-event{display:none}
  .nav{flex-direction:row;width:100%;justify-content:space-around}
  .nav a{flex-direction:column;gap:2px;padding:7px 6px;font-size:10.5px}
  .nav .badge{display:none}
  main{padding:20px 16px 100px}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .g6{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero{padding:24px}.hero h2{font-size:26px}
  .bar-row{grid-template-columns:90px 1fr 60px}
  .ticket{flex-direction:column;text-align:center}
}

</div>

<input type="file" id="fileImport" accept=".xlsx,.xls,.csv" class="hide">

<button class="btn exit-present" data-action="present">Exit presentation</button>

<script>
/* ============ Icons ============ */
const I={
  dash:'<path d="M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z"/>',
  users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
  send:'<path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/>',
  inbox:'<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>',
  scan:'<path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 12h10"/>',
  chart:'<path d="M3 3v18h18"/><path d="M7 16v-5M12 16V8M17 16v-9"/>',
  upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5M12 3v12"/>',
  download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5M12 15V3"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',
  qr:'<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>',
  trash:'<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>',
  mail:'<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/>',
  eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  reply:'<path d="M9 17 4 12l5-5"/><path d="M20 18v-2a4 4 0 0 0-4-4H4"/>',
  bell:'<path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/>',
  alert:'<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',
  info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',
  copy:'<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
  bolt:'<path d="M13 2 3 14h9l-1 8 10-12h-9z"/>',
  door:'<path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/>',
  reset:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>',
  wa:'<path d="M21 11.5a8.4 8.4 0 0 1-12.3 7.4L3 21l2.1-5.6A8.4 8.4 0 1 1 21 11.5z"/>',
  sms:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h8"/>',
  award:'<circle cx="12" cy="8" r="6"/><path d="M8.2 13.2 7 22l5-3 5 3-1.2-8.8"/>',
  wifi:'<path d="M5 12.55a11 11 0 0 1 14.08 0M1.42 9a16 16 0 0 1 21.16 0M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01"/>',
  lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  present:'<rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>',
  phone:'<rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 18h2"/>',
  monitor:'<rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/>'
};
const ic=(n,cls='')=>`<svg class="${cls}" viewBox="0 0 24 24">${I[n]||''}</svg>`;
const logo=(cls='')=>`<svg class="${cls}" viewBox="0 0 100 100"><use href="#kode-logo"/></svg>`;

/* ============ Helpers ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now=()=>Date.now();
const uid=()=>Math.random().toString(36).slice(2,10);
const rand=(a,b)=>a+Math.random()*(b-a);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const pct=(a,b)=>b?Math.round(a/b*100):0;
const EMAIL_RE=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
const ALPH='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
function fmtDate(d){if(!d)return'';const x=new Date(d+'T00:00:00');return isNaN(x)?d:x.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'})}
function fmtTime(t){return t?new Date(t).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}):''}
function fmtDateLong(d){if(!d)return'';const x=new Date(d+'T00:00:00');return isNaN(x)?d:x.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
const TITLE_RE=/^(dr|prof|professor|mr|mrs|ms|miss|eng|sir|dame)\.?$/i;
const firstName=g=>{const w=(g.name||'').trim().split(/\s+/);return TITLE_RE.test(w[0]||'')&&w[1]?`${w[0].replace(/\.?$/,'.')} ${w[1]}`:(w[0]||'there')};
const initials=n=>(n||'?').split(/\s+/).filter(w=>!TITLE_RE.test(w)).map(w=>w[0]).slice(0,2).join('').toUpperCase();
function fmtDT(t){return t?new Date(t).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):''}
function ago(t){const s=Math.max(0,(now()-t)/1000);if(s<45)return'just now';if(s<3600)return Math.round(s/60)+'m ago';if(s<86400)return Math.round(s/3600)+'h ago';return Math.round(s/86400)+'d ago'}
function toast(msg){const d=document.createElement('div');d.className='toast';d.textContent=msg;$('#toasts').appendChild(d);setTimeout(()=>{d.style.transition='.3s';d.style.opacity='0';setTimeout(()=>d.remove(),300)},3200)}

/* ============ State ============ */
const LS='kode-qr-system-v3';
const DEFAULT_TPL={
  subject:"Invitation: {{event}}",
  body:"On behalf of the organising committee, we are pleased to invite you to {{event}}, taking place over two days at {{venue}}.\n\nAttendance on both days is required to receive your certificate of attendance.\n\nYour personal QR pass is below. The same code is scanned at the entrance on each day.",
  accept:"Thank you for confirming — your place at {{event}} is reserved.\n\nPlease bring this QR pass on both days. It is scanned at the entrance each morning, and your certificate is issued once both days are recorded.",
  decline:"Thank you for letting us know. We're sorry you can't join us for {{event}}, and we'll be sure to keep you informed about future programmes.",
  reminder:"A gentle reminder that {{event}} begins on {{date}}. We haven't received your RSVP yet — please confirm below so we can reserve your seat.",
  cert:"Thank you for attending {{event}}. Our records show you attended both days, and your certificate of attendance is attached to this email.\n\nWe hope to welcome you again at our next programme."
};
const DEFAULT_SESSIONS=[
  {id:'d1',day:1,type:'',date:'2026-11-25',time:'09:00',room:'Main entrance'},
  {id:'d2',day:2,type:'',date:'2026-11-26',time:'09:00',room:'Main entrance'}];
const DEFAULT_CERT={enabled:true,title:'Certificate of Attendance',hours:12,signer1:'Conference Chair',signer2:'Head of Scientific Committee'};
const EVENT_EXTRAS={banner:'preset:spotlight',bannerConfirm:true,tagline:'Two days of clinical insight, talks and hands-on learning',dress:'Business attire',rsvpBy:'2026-11-23',allowPlusOne:false};
function freshState(){
  return{
    sessions:DEFAULT_SESSIONS.map(x=>({...x})),
    event:{...EVENT_EXTRAS,cert:{...DEFAULT_CERT},name:'Annual Medical Conference 2026',date:'2026-11-25',time:'09:00',venue:'Conference Centre, Cairo',sender:'The Organising Committee',eventId:'EVT'+Math.random().toString(36).slice(2,6).toUpperCase()},
    tpl:{...DEFAULT_TPL},
    channels:{email:true,whatsapp:false,sms:false},
    guests:[],outbox:[],log:[],scans:[],tplV:4
  };
}
let state=null;
try{state=JSON.parse(localStorage.getItem(LS))}catch(e){}
if(!state||!state.event||!Array.isArray(state.guests))state=freshState();
state.event={...EVENT_EXTRAS,...state.event};
if(state.tplV!==4){state.tpl={...DEFAULT_TPL};state.tplV=4}
if(!Array.isArray(state.sessions))state.sessions=DEFAULT_SESSIONS.map(x=>({...x}));
state.event.cert={...DEFAULT_CERT,...(state.event.cert||{})};
state.tpl={...DEFAULT_TPL,...state.tpl};
function persist(){try{localStorage.setItem(LS,JSON.stringify(state));return true}catch(e){return false}}
function commit(){persist();render()}
function log(type,text,gid,t=now()){state.log.unshift({t,type,text,gid});if(state.log.length>3000)state.log.length=3000}

const GV0={mode:'mail',msgId:null,rsvpV:'accepted',p1:false,p1name:'',p1email:'',diet:'',note:'',done:false,door:null};
let ui={sid:null,offline:false,findQ:'',attQ:'',attF:'all',certGid:null,gv:{...GV0,gid:null,device:'desktop'},guestQ:'',guestF:'all',msgF:'all',tplTab:'body',previewId:null,lastScan:null,sendProg:null,lastField:null};

function genCode(){let c;do{let s='';for(let i=0;i<8;i++)s+=ALPH[Math.floor(Math.random()*ALPH.length)];c='KD-'+s.slice(0,4)+'-'+s.slice(4)}while(state.guests.some(g=>g.code===c||(g.plusOne&&g.plusOne.code===c)));return c}
const payload=g=>`KODE|${state.event.eventId}|${g.code}`;
function status(g){if(g.checkedInAt)return'checked';if(g.rsvp==='accepted')return'confirmed';if(g.rsvp==='declined')return'declined';if(g.bounced)return'bounced';if(g.openedAt)return'opened';if(g.sentAt)return'invited';return'pending'}
const ST={pending:'Not invited',invited:'Invited',bounced:'Bounced',opened:'Opened',confirmed:'Confirmed',declined:'Declined',checked:'Checked in'};
const pill=s=>`<span class="pill st-${s}">${ST[s]}</span>`;
const sName=x=>x.type?`Day ${x.day} · ${x.type}`:`Day ${x.day}`;
const sShort=x=>x.type?`D${x.day} ${x.type}`:`Day ${x.day}`;
const allDays=()=>state.sessions.length===2?'both days':`all ${state.sessions.length} days`;
const sAt=x=>new Date(`${x.date}T${x.time||'09:00'}`).getTime();
const attCount=o=>state.sessions.filter(x=>o&&o.att&&o.att[x.id]).length;
const eligible=g=>state.sessions.length>0&&attCount(g)===state.sessions.length;
const missingS=g=>state.sessions.filter(x=>!(g.att&&g.att[x.id]));
const dots=o=>`<span class="dots" title="${attCount(o)} of ${state.sessions.length} sessions">${state.sessions.map(x=>`<i class="${o&&o.att&&o.att[x.id]?'on':''}"></i>`).join('')}</span>`;
function certState(g){if(g.certSentAt)return['sent','Certificate sent'];if(eligible(g))return['elig','Eligible · 4/4'.replace('4/4',`${state.sessions.length}/${state.sessions.length}`)];const n=attCount(g);if(!n)return['none','Not started'];return['miss','Missing: '+missingS(g).map(sShort).join(', ')]}
const certPill=g=>{const [k,l]=certState(g);return`<span class="pill st-${k}">${esc(l)}</span>`};
function curSession(){
  let x=state.sessions.find(y=>y.id===ui.sid);if(x)return x;
  const T=now(),today=state.sessions.filter(y=>y.date===new Date().toISOString().slice(0,10));
  x=today.filter(y=>sAt(y)<=T+45*60000).pop()||today[0]||state.sessions[0];
  if(x)ui.sid=x.id;return x;
}
function eventDates(long=true){
  const ds=[...new Set(state.sessions.map(x=>x.date))].sort();if(!ds.length)return fmtDateLong(state.event.date);if(ds.length===1)return fmtDateLong(ds[0]);
  const a=new Date(ds[0]+'T00:00:00'),b=new Date(ds[ds.length-1]+'T00:00:00');
  if(a.getMonth()===b.getMonth()&&a.getFullYear()===b.getFullYear()){const my=b.toLocaleDateString('en-GB',{month:'long',year:'numeric'});return long?`${a.toLocaleDateString('en-GB',{weekday:'short'})} ${a.getDate()} – ${b.toLocaleDateString('en-GB',{weekday:'short'})} ${b.getDate()} ${my}`:`${a.getDate()}–${b.getDate()} ${my}`}
  return`${fmtDate(ds[0])} – ${fmtDate(ds[ds.length-1])}`;
}
function recordAttendance(g,x,t=now(),src='scan',p=null){
  const o=p||g;o.att=o.att||{};o.att[x.id]={t,src,synced:!ui.offline};
  if(!o.checkedInAt){o.checkedInAt=t;o.gate=x.room}
  log('checkin',`${p?`${p.name} (+1 of ${g.name})`:g.name} attended ${sName(x)}${src==='manual'?' (marked manually)':src==='override'?' (override)':src==='walk-in'?' (walk-in)':''}`,g.id,t);
  if(!p&&eligible(g))log('cert',`${g.name} attended ${allDays()} — certificate eligible`,g.id,t+1);
}
function stats(){
  const G=state.guests,c={total:G.length,pending:0,invited:0,bounced:0,opened:0,confirmed:0,declined:0,checked:0};
  G.forEach(g=>c[status(g)]++);
  c.sent=G.filter(g=>g.sentAt).length;
  c.delivered=G.filter(g=>g.sentAt&&!g.bounced).length;
  c.openedAll=G.filter(g=>g.openedAt).length;
  c.accepted=G.filter(g=>g.rsvp==='accepted').length;
  c.declinedAll=G.filter(g=>g.rsvp==='declined').length;
  c.checkedAll=G.filter(g=>g.checkedInAt).length;
  c.noRsvp=G.filter(g=>g.sentAt&&!g.bounced&&!g.rsvp).length;
  c.autoreplies=state.outbox.filter(m=>m.kind.startsWith('auto')).length;
  c.invalid=G.filter(g=>!g.emailValid&&!g.walkIn).length;
  c.walkins=G.filter(g=>g.walkIn).length;
  c.plusOnes=G.filter(g=>g.rsvp==='accepted'&&g.plusOne).length;
  c.plusArrived=G.filter(g=>g.plusOne&&g.plusOne.checkedInAt).length;
  c.headcount=c.accepted+c.plusOnes;
  c.sess=state.sessions.map(x=>G.filter(g=>g.att&&g.att[x.id]).length);
  c.eligible=G.filter(eligible).length;
  c.certSent=G.filter(g=>g.certSentAt).length;
  c.incomplete=G.filter(g=>attCount(g)>0&&!eligible(g)).length;
  c.complete=[0,1,2,3,4].map(n=>G.filter(g=>g.rsvp==='accepted'&&attCount(g)===n).length);
  c.arrivedTotal=c.checkedAll+c.plusArrived;
  return c;
}
function fill(str,g){
  const e=state.event,first=(g.name||'').trim().split(/\s+/)[0]||'there';
  const map={plus_one:g.plusOne?g.plusOne.name:'',rsvp_by:fmtDateLong(e.rsvpBy),name:g.name,first_name:first,event:e.name,date:fmtDate(e.date),time:e.time,venue:e.venue,sender:e.sender,code:g.code,email:g.email,phone:g.phone,company:g.company||''};
  return String(str||'').replace(/\{\{\s*(\w+)\s*\}\}/g,(m,k)=>k in map?map[k]:m);

/* ============ QR ============ */

function qrSvg(text){
  const q=makeQR(text);if(!q)return'<svg viewBox="0 0 10 10"><text x="1" y="6" font-size="2">QR lib offline</text></svg>';

  return{
    name:f(/^(full\s*)?name$|^guest|^attendee|^contact|الاسم|^name/),
    first:f(/first/),last:f(/last|surname|family/),
    email:f(/e-?mail|بريد/),
    phone:f(/phone|mobile|number|whats|tel|cell|رقم|هاتف|جوال/),
    company:f(/company|organi[sz]ation|^org|employer|شركة|business/),
    plus:f(/plus|\+1|companion|guest allowed/)

}
function importRows(rows,source){

  if(!rows.length){toast('That file looks empty');return}
  let hi=-1,cols=null;
  for(let i=0;i<Math.min(rows.length,10);i++){const c=detectCols(rows[i]);if(c.email>=0&&(c.name>=0||c.first>=0)){hi=i;cols=c;break}}
  if(hi<0){cols={name:0,first:-1,last:-1,email:1,phone:2,company:3,plus:-1};
    const r0=rows[0].map(x=>String(x??''));if(!r0.some(x=>x.includes('@')))hi=0;}
  const data=rows.slice(hi+1);
  const seen=new Set(state.guests.map(g=>(g.email||'').toLowerCase()).filter(Boolean));
  const seenP=new Set(state.guests.map(g=>(g.phone||'').replace(/\D/g,'')).filter(Boolean));
  let added=0,dupes=[],invalid=[],skipped=0;const t=now();
  data.forEach(r=>{

    const email=get(cols.email).toLowerCase(),phone=get(cols.phone),company=get(cols.company);
    if(!name&&!email&&!phone){skipped++;return}

}

const KIND={certificate:'Certificate',invite:'Invitation',reminder:'Reminder','auto-accept':'Auto-reply · Confirmed','auto-decline':'Auto-reply · Declined'};
function deliver(g,kind,t=now()){
  const ch=activeChannels();let ok=false;
  const subject=kind==='certificate'?`Your certificate of attendance — ${state.event.name}`:kind==='invite'?fill(state.tpl.subject,g):kind==='reminder'?`Reminder: ${state.event.name}`:kind==='auto-accept'?`You're confirmed — ${state.event.name}`:`RSVP received — ${state.event.name}`;

  ch.forEach(c=>{
    if(c!=='email'&&!g.phone)return;
    const st=(c==='email'&&!g.emailValid)?'bounced':'delivered';
    if(st==='delivered')ok=true;
    state.outbox.unshift({id:uid(),t,gid:g.id,kind,channel:c,to:c==='email'?(g.email||'—'):g.phone,subject,body,status:st});
  });
  if(kind==='invite'){g.sentAt=t;g.bounced=!ok}
  if(kind==='reminder')g.reminders=(g.reminders||0)+1;

function processScan(raw,sidOverride){
  raw=String(raw||'').trim();
  let code=null,evOk=true;
  const m=raw.match(/^KODE\|([^|]+)\|(KD-[A-Z0-9]{4}-[A-Z0-9]{4})$/i);
  if(m){code=m[2].toUpperCase();evOk=m[1]===state.event.eventId}
  else{const m2=raw.toUpperCase().replace(/\s/g,'').match(/^KD-?([A-Z0-9]{4})-?([A-Z0-9]{4})$/);if(m2)code=`KD-${m2[1]}-${m2[2]}`}

  let res;
  if(!code)res={type:'bad',title:'Invalid QR code',sub:'This code wasn’t issued by KODE.'};
  else if(!evOk)res={type:'bad',title:'Wrong event',sub:'This pass belongs to a different event.'};
  else{
    const f=findPass(code);

    else{
      const {g,p}=f,o=p||g,who=p?`${p.name} (+1 of ${g.name})`:g.name;res={gid:g.id,name:who};

      res.prog=state.sessions.map(y=>!!(o.att&&o.att[y.id]));

}
async function scanImage(file){
  if(!file)return;
  if(typeof jsQR!=='function'){toast('QR decoder failed to load');return}
  try{
    const bmp=await createImageBitmap(file);
    // Try the whole image, then progressively tighter crops — logos or text near the code can confuse detection
    const tries=[[0,0,1,1400],[0,0,1,800],[.1,.1,.8,1000],[.2,.15,.6,900],[.15,.25,.7,900],[.25,.3,.5,700]];
    let r=null;
    for(const [fx,fy,fw,max] of tries){
      const sw=bmp.width*fw,sh=bmp.height*fw,sx=bmp.width*fx,sy=bmp.height*fy;
      const sc=Math.min(1,max/Math.max(sw,sh));
      const c=document.createElement('canvas');c.width=Math.max(1,Math.round(sw*sc));c.height=Math.max(1,Math.round(sh*sc));
      const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(bmp,sx,sy,sw,sh,0,0,c.width,c.height);
      const d=x.getImageData(0,0,c.width,c.height);

      if(r&&r.data)break;
    }
    if(r&&r.data)processScan(r.data);
    else{ui.lastScan={type:'bad',title:'No QR found',sub:'Couldn’t find a QR code in that image — try a closer, sharper photo.',t:now()};render()}
  }catch(e){toast('Couldn’t read that image')}
}

function arrivals(){
  const ts=[];state.guests.forEach(g=>{if(g.checkedInAt)ts.push(g.checkedInAt);if(g.plusOne&&g.plusOne.checkedInAt)ts.push(g.plusOne.checkedInAt)});ts.sort((a,b)=>a-b);
  if(!ts.length)return null;
  const step=10*60000,start=Math.floor(ts[0]/step)*step,end=Math.floor(ts[ts.length-1]/step)*step;
  const n=Math.min(24,Math.round((end-start)/step)+1),b=Array.from({length:n},(_,i)=>({t:start+i*step,c:0}));
  ts.forEach(t=>{const i=Math.min(n-1,Math.floor((t-start)/step));b[i].c++});return b;
}

function gvSubmit(){

}

 ['Event',e.name],['Date',`${fmtDate(e.date)} ${e.time}`],['Venue',e.venue],['Generated',new Date().toLocaleString('en-GB')],[],
 ['Total guests',s.total],['Walk-ins (registered at the door)',s.walkins],['Invitations sent',s.sent],['Delivered',s.delivered],['Bounced',s.bounced],['Opened',s.openedAll],['Confirmed',s.accepted],['Declined',s.declinedAll],['Awaiting RSVP',s.noRsvp],['Plus-ones confirmed',s.plusOnes],['Expected headcount',s.headcount],['Checked in (guests)',s.checkedAll],['Checked in (incl. +1s)',s.arrivedTotal],['No-shows',state.guests.filter(g=>g.rsvp==='accepted'&&!g.checkedInAt).length],
 [],['Certificate eligible',s.eligible],['Certificates sent',s.certSent],...state.sessions.map((x,i)=>[`Attended ${sName(x)}`,s.sess[i]]),[],['Delivery rate',pct(s.delivered,s.sent)+'%'],['Open rate',pct(s.openedAll,s.delivered)+'%'],['Acceptance rate',pct(s.accepted,s.accepted+s.declinedAll)+'%'],['Attendance rate',pct(s.checkedAll,s.accepted)+'%'],['Auto-replies sent',s.autoreplies]]}
function exportXlsx(){
  if(typeof XLSX==='undefined'){toast('Excel library failed to load');return}
  const wb=XLSX.utils.book_new();
  const ws1=XLSX.utils.aoa_to_sheet([['KODE — Event Report'],[],...summaryLines()]);ws1['!cols']=[{wch:22},{wch:44}];XLSX.utils.book_append_sheet(wb,ws1,'Summary');
  const wsA=XLSX.utils.json_to_sheet(state.guests.map(attRow));wsA['!cols']=[26,30,26,...state.sessions.map(()=>20),16,14,40].map(w=>({wch:w}));XLSX.utils.book_append_sheet(wb,wsA,'Attendance');
  const ws2=XLSX.utils.json_to_sheet(guestRows());ws2['!cols']=[22,30,18,18,14,12,10,18,18,10,18,18,14,20,14,18,20,24,10].map(w=>({wch:w}));XLSX.utils.book_append_sheet(wb,ws2,'Guests');
  const ws3=XLSX.utils.json_to_sheet(state.outbox.map(m=>{const g=state.guests.find(x=>x.id===m.gid);return{'Time':fmtDT(m.t),'Type':KIND[m.kind],'Guest':g?g.name:'','Channel':m.channel,'To':m.to,'Subject':m.subject,'Status':m.status}}));XLSX.utils.book_append_sheet(wb,ws3,'Messages');
  const ws4=XLSX.utils.json_to_sheet(state.scans.map(x=>{const g=state.guests.find(y=>y.id===x.gid);return{'Time':fmtDT(x.t),'Result':x.type==='ok'?'Granted':x.type==='dup'?'Duplicate':x.type==='warn'?'Declined RSVP':'Rejected','Guest':x.name||(g?g.name:''),'Code':x.code,'Day':x.gate}}));XLSX.utils.book_append_sheet(wb,ws4,'Scans');
  const ws5=XLSX.utils.json_to_sheet(state.log.map(l=>({'Time':fmtDT(l.t),'Event':l.text})));XLSX.utils.book_append_sheet(wb,ws5,'Activity');
  saveFile(`KODE-report-${state.event.name.replace(/[^\w]+/g,'-')}.xlsx`,new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})]));
}
function csvText(){const rows=guestRows();if(!rows.length)return'';const h=Object.keys(rows[0]);const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;return[h.map(q).join(','),...rows.map(r=>h.map(k=>q(r[k])).join(','))].join('\n')}

/* ============ Events ============ */
function afterRender(v){
  const gq=$('#gq');if(gq){gq.addEventListener('input',e=>{ui.guestQ=e.target.value;const p=e.target.selectionStart;render();const n=$('#gq');n.focus();n.setSelectionRange(p,p)})}
  const gf=$('#gf');if(gf)gf.addEventListener('change',e=>{ui.guestF=e.target.value;render()});
  document.querySelectorAll('.tplf').forEach(el=>{el.addEventListener('focus',()=>ui.lastField=el);el.addEventListener('input',()=>{state.tpl[el.dataset.k]=el.value;persist();$('#preview').innerHTML=previewHtml()})});
  document.querySelectorAll('.evf').forEach(el=>el.addEventListener('input',()=>{state.event[el.dataset.k]=el.value;persist();$('#preview').innerHTML=previewHtml()}));
  document.querySelectorAll('.evf').forEach(el=>el.addEventListener('change',()=>render()));
  const pv=$('#pvSel');if(pv)pv.addEventListener('change',e=>{ui.previewId=e.target.value;$('#preview').innerHTML=previewHtml()});
  const gvs=$('#gvSel');if(gvs)gvs.addEventListener('change',e=>{Object.assign(ui.gv,{...GV0,gid:e.target.value});render()});
  document.querySelectorAll('.gvf').forEach(el=>el.addEventListener('input',()=>{ui.gv[el.dataset.k]=el.value}));
  const rf=$('#rsvpForm');if(rf)rf.addEventListener('submit',e=>{e.preventDefault();gvSubmit()});
  const fg=$('#findGuest');if(fg)fg.addEventListener('input',e=>{ui.findQ=e.target.value;$('#findRes').innerHTML=findResults()});
  const aq=$('#aq');if(aq)aq.addEventListener('input',e=>{ui.attQ=e.target.value;const p=e.target.selectionStart;render();const n=$('#aq');n.focus();n.setSelectionRange(p,p)});
  const af=$('#af');if(af)af.addEventListener('change',e=>{ui.attF=e.target.value;render()});
  const cs=$('#certSel');if(cs)cs.addEventListener('change',e=>{ui.certGid=e.target.value;render()});
  document.querySelectorAll('.certf').forEach(el=>el.addEventListener('change',()=>{state.event.cert[el.dataset.k]=el.type==='number'?+el.value:el.value;commit()}));
  document.querySelectorAll('.sesf').forEach(el=>el.addEventListener('change',()=>{const x=state.sessions.find(y=>y.id===el.dataset.id);if(x){x[el.dataset.k]=el.value;if(x.id==='d1c'){state.event.date=x.date;state.event.time=x.time}persist();$('#preview')&&($('#preview').innerHTML=previewHtml())}}));
  const gs=$('#gateSel');if(gs)gs.addEventListener('change',e=>ui.gate=e.target.value);
  const mf=$('#manualForm');if(mf)mf.addEventListener('submit',e=>{e.preventDefault();const v=$('#manualCode').value;if(v.trim())processScan(v)});
  ['dropImport','vf'].forEach(id=>{const d=$('#'+id);if(!d)return;
    d.addEventListener('dragover',e=>{e.preventDefault();d.classList.add('over')});
    d.addEventListener('dragleave',()=>d.classList.remove('over'));
    d.addEventListener('drop',e=>{e.preventDefault();d.classList.remove('over');const f=e.dataTransfer.files[0];if(!f)return;id==='vf'?scanImage(f):handleImportFile(f)})});
}
$('#fileImport').addEventListener('change',e=>{handleImportFile(e.target.files[0]);e.target.value=''});
$('#fileBanner').addEventListener('change',e=>{setBannerFromFile(e.target.files[0]);e.target.value=''});
$('#fileScan').addEventListener('change',e=>{scanImage(e.target.files[0]);e.target.value=''});
window.addEventListener('hashchange',()=>{if(ui.keepModal)ui.keepModal=false;else closeModal();render();window.scrollTo(0,0)});

document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-action]');if(!el)return;
  const a=el.dataset.action,id=el.dataset.id,g=id?state.guests.find(x=>x.id===id):null;
  if(el.tagName==='A'&&el.getAttribute('href')==='#')e.preventDefault();
  switch(a){
    case 'close-modal':closeModal();break;
    case 'rsvp-start':if(!g)break;gvStartRsvp(g,el.dataset.v);if(cur()==='guest-view'){closeModal();render();$('#view').scrollIntoView({behavior:'smooth'})}else location.hash='guest-view';break;
    case 'gv-goto':if(!g)break;{const m=gvInbox(g)[0];Object.assign(ui.gv,{...GV0,gid:g.id,msgId:m?m.id:null});if(m)m.read=true;if(cur()==='guest-view'){closeModal();render()}else location.hash='guest-view'}break;
    case 'gv-open':{const m=state.outbox.find(x=>x.id===id);if(!m)break;m.read=true;ui.gv.msgId=id;const gg=state.guests.find(x=>x.id===m.gid);if(gg&&!gg.openedAt&&(m.kind==='invite'||m.kind==='reminder')){gg.openedAt=now();log('open',`${gg.name} opened the invitation`,gg.id)}commit()}break;
    case 'gv-back':if(ui.gv.mode==='rsvp'){ui.gv.mode='mail';ui.gv.done=false}else ui.gv.msgId=null;render();break;
    case 'gv-v':ui.gv.rsvpV=el.dataset.v;render();break;
    case 'gv-p1':ui.gv.p1=el.dataset.v==='1';render();if(ui.gv.p1){const i=document.querySelector('[data-k="p1name"]');if(i)i.focus()}break;
    case 'gv-device':ui.gv.device=el.dataset.v;render();break;
    case 'gv-send':{const gg=gvGuest();if(!gg)break;if(!state.channels.email){state.channels.email=true;toast('Email channel turned on')}deliver(gg,'invite');const m=gvInbox(gg)[0];ui.gv.msgId=null;commit();toast(`Invitation delivered to ${gg.email}`);setTimeout(()=>{if(cur()==='guest-view'&&m&&!ui.gv.msgId){m.read=true;ui.gv.msgId=m.id;const g3=gvGuest();if(g3&&!g3.openedAt){g3.openedAt=now();log('open',`${g3.name} opened the invitation`,g3.id)}commit()}},1100)}break;
    case 'gv-reset':{const gg=gvGuest();if(!gg)break;gvReset(gg);commit();toast(`Restarted the demo for ${gg.name}`)}break;
    case 'gv-scan':{const gg=gvGuest();if(!gg)break;processScan(`KODE|${state.event.eventId}|${gg.code}`,el.dataset.sid);ui.gv.door=ui.lastScan;render()}break;
    case 'pick-session':ui.sid=id;ui.lastScan=null;render();break;
    case 'toggle-offline':setOffline(!ui.offline);break;
    case 'mark-att':{if(!g)break;closeModal();const x=curSession();recordAttendance(g,x,now(),'manual');state.scans.unshift({t:now(),type:'ok',gid:g.id,name:g.name,code:'manual',gate:sName(x),sid:x.id,synced:!ui.offline});ui.lastScan={type:'ok',title:`Marked present · ${sName(x)}`,sub:`${g.name} — ${attCount(g)} of ${state.sessions.length} days (manual, logged for audit)`,gid:g.id,t:now(),gate:sName(x),sid:x.id,prog:state.sessions.map(y=>!!(g.att&&g.att[y.id]))};ui.findQ='';commit()}break;
    case 'sim-session':simulateSession(curSession());break;
    case 'sim-day':simulateDay(+el.dataset.v);break;
    case 'cert-view':ui.certGid=id;location.hash='certificates';break;
    case 'cert-send-one':if(!g)break;if(!eligible(g)){toast('Not eligible yet');break}if(!state.channels.email)state.channels.email=true;deliver(g,'certificate');commit();toast(`Certificate sent to ${g.email}`);if(cur()==='guest-view'){const m=gvInbox(g)[0];setTimeout(()=>{if(m&&cur()==='guest-view'){m.read=true;ui.gv.msgId=m.id;commit()}},700)}break;
    case 'cert-send-all':sendBatch(state.guests.filter(x=>eligible(x)&&!x.certSentAt),'certificate');break;
    case 'cert-download':if(!g)break;drawCert(g,2400).toBlob(b=>b&&saveFile(`Certificate-${g.name.replace(/[^\w]+/g,'-')}.png`,b),'image/png');break;
    case 'present':document.body.classList.toggle('present');window.scrollTo(0,0);break;
    case 'banner':if(el.dataset.v!=='__keep'){state.event.banner=el.dataset.v;persist();render()}break;
    case 'banner-upload':$('#fileBanner').click();break;
    case 'banner-confirm':state.event.bannerConfirm=el.checked;persist();$('#preview')&&($('#preview').innerHTML=previewHtml());break;
    case 'ev-plus':state.event.allowPlusOne=el.checked;persist();$('#preview')&&($('#preview').innerHTML=previewHtml());break;
    case 'import':if(e.target.closest('a')&&e.target.closest('a').dataset.action==='load-sample')break;$('#fileImport').click();break;
    case 'load-sample':e.stopPropagation();importRows(SAMPLE_MED.map(r=>r.slice()),'Sample guest list (26 doctors)');break;
    case 'template':if(typeof XLSX==='undefined'){toast('Excel library failed to load');break}saveFile('KODE-guest-template.xlsx',templateBlob());break;
    case 'add-guest':openAddGuest();break;
    case 'walk-in':openWalkIn();break;
    case 'view':e.preventDefault();openGuest(id);break;
    case 'send-one':if(!g)break;if(!activeChannels().length){toast('Turn on at least one channel');break}{const ok=deliver(g,'invite');commit();toast(ok?`Invitation sent to ${g.name}`:`Invitation to ${g.name} bounced`);if(ui.modalGuest===g.id)openGuest(g.id)}break;
    case 'checkin':if(!g)break;{const x=curSession();if(g.att&&g.att[x.id]){toast(`${g.name} is already in ${sName(x)}`);break}recordAttendance(g,x,now(),'manual');state.scans.unshift({t:now(),type:'ok',gid:g.id,name:g.name,code:'manual',gate:sName(x),sid:x.id,synced:!ui.offline});commit();toast(`${g.name} marked present for ${sName(x)}`)}if(ui.modalGuest===g.id)openGuest(g.id);break;
    case 'override':if(!g)break;{const x=curSession();recordAttendance(g,x,now(),'override');ui.lastScan={type:'ok',title:`Checked in · ${sName(x)}`,sub:`${g.name} allowed in (override) — ${attCount(g)} of ${state.sessions.length} days.`,gid:g.id,t:now(),gate:sName(x),sid:x.id,prog:state.sessions.map(y=>!!(g.att&&g.att[y.id]))};commit()}break;
    case 'delete':if(!g)break;if(el.dataset.confirm!=='1'){el.dataset.confirm='1';el.style.color='var(--bad)';el.title='Click again to remove';toast('Click again to remove '+g.name);setTimeout(()=>{el.dataset.confirm='';el.style.color=''},2500);break}
      state.guests=state.guests.filter(x=>x.id!==id);log('import',`Removed ${g.name}`,null);commit();break;
    case 'send-all':sendBatch(state.guests.filter(x=>!x.sentAt),'invite');break;
    case 'remind':sendBatch(state.guests.filter(x=>x.sentAt&&!x.bounced&&!x.rsvp),'reminder');break;
    case 'simulate-responses':simulateResponses();break;
    case 'rsvp':if(!g)break;setRsvp(g,el.dataset.v);commit();toast(`${g.name} ${el.dataset.v==='accepted'?'confirmed':'declined'} → auto-reply sent`);openGuest(g.id);break;
    case 'download-pass':if(!g)break;{const b=await passBlob(g);if(b)saveFile(`KODE-pass-${g.name.replace(/[^\w]+/g,'-')}.png`,b)}break;
    case 'copy-code':if(g)copyText(g.code,'Pass code copied');break;
    case 'tpl-tab':ui.tplTab=el.dataset.k;render();break;
    case 'tpl-reset':state.tpl[ui.tplTab]=DEFAULT_TPL[ui.tplTab];if(ui.tplTab==='body')state.tpl.subject=DEFAULT_TPL.subject;commit();toast('Template reset');break;
    case 'ph':{const f=ui.lastField&&document.body.contains(ui.lastField)?ui.lastField:document.querySelector('textarea.tplf');if(!f)break;const s=f.selectionStart??f.value.length,en=f.selectionEnd??s;f.value=f.value.slice(0,s)+el.dataset.ph+f.value.slice(en);f.focus();f.setSelectionRange(s+el.dataset.ph.length,s+el.dataset.ph.length);f.dispatchEvent(new Event('input'))}break;
    case 'channel':state.channels[el.dataset.k]=el.checked;persist();break;
    case 'msg-f':ui.msgF=el.dataset.k;render();break;
    case 'msg':openMessage(id);break;
    case 'scan-upload':$('#fileScan').click();break;
    case 'scan-demo':{const k=el.dataset.k;let t=null;
      const sid=curSession().id;
      if(k==='valid'){const p=state.guests.filter(x=>!(x.att&&x.att[sid])&&x.rsvp==='accepted');const q=p.length?p:state.guests.filter(x=>!(x.att&&x.att[sid])&&x.rsvp!=='declined');if(!q.length){toast('Everyone is already checked in today');break}t=payload(q[Math.floor(Math.random()*q.length)])}
      else if(k==='dup'){const last=ui.lastScan&&ui.lastScan.gid&&state.guests.find(x=>x.id===ui.lastScan.gid&&x.att&&x.att[sid]);const p=state.guests.filter(x=>x.att&&x.att[sid]);if(!p.length){toast('Check someone in first');break}t=payload(last||p[0])}
      else t='https://totally-real-tickets.biz/vip?id=12345';
      processScan(t)}break;
    case 'simulate-arrivals':simulateArrivals();break;
    case 'export-xlsx':exportXlsx();break;
    case 'export-csv':{const t=csvText();if(!t){toast('No guests yet');break}saveFile('KODE-guests.csv',new Blob([t],{type:'text/csv'}))}break;
    case 'copy-summary':copyText(summaryLines().map(r=>r.length?r.join(': '):'').join('\n'),'Summary copied');break;
    case 'reset':if(el.dataset.confirm!=='1'){el.dataset.confirm='1';el.innerHTML=`${ic('reset')} Click again to wipe all data`;setTimeout(()=>{if(document.body.contains(el)){el.dataset.confirm='';el.innerHTML=`${ic('reset')} Reset demo`}},3000);break}
      state=freshState();ui.lastScan=null;ui.previewId=null;commit();location.hash='dashboard';toast('Demo reset');break;
  }
});

render();
// Re-render once fonts & libs are ready so the logo and QR codes are crisp
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>{if(!$('#modalBg').classList.contains('on'))render()});
setInterval(()=>{if(cur()==='dashboard'&&!$('#modalBg').classList.contains('on')&&!ui.sendProg)render()},30000);
